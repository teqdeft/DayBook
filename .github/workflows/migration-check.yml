# Migrations 018 (CONTRACT 25), 019 (CONTRACT 27) and 020 (CONTRACT 28) on MySQL 8.4, the engine
# production may run. Local development runs MariaDB 10.4 (XAMPP), so this is where they meet
# MySQL 8.4 before the live migrate: migrate up from an empty database, down for 020 and then 019
# (019's down can't drop project_files while task_file_links points at it), up again, down for 018
# only, up again, down for 020 only, up again, then the 018, 019 and 020 service tests and the 1.13
# service tests whose new grouped and locking reads must pass MySQL 8.4's ONLY_FULL_GROUP_BY. It
# runs on main and pull requests to main only, never on the deploy branch, and publishes nothing.
name: Migration check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: migration-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-8-4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          # A throwaway container: these are not secrets.
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: daybook_test
          MYSQL_USER: daybook
          MYSQL_PASSWORD: ci-daybook
        ports:
          - 3306:3306
        # Over TCP, so the entrypoint's temporary init server (socket only) never counts as up.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Only what src/lib/env.js checks. The migrations and tests run as a user with rights on
      # its own database only, as on the cPanel host. The database name contains "test", which
      # resetDatabase() requires.
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: daybook
      DB_PASSWORD: ci-daybook
      DB_NAME: daybook_test
      SESSION_SECRET: ci-only-placeholder-never-used-at-runtime-0000
      DEFAULT_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The image creates the database with MySQL 8.4's utf8mb4_0900_ai_ci; Daybook's databases
      # use utf8mb4_unicode_ci (tests/e2e/support/database.js), so the tables made by knex match.
      - name: Set the database collation
        run: |
          node --input-type=module -e "
            import mysql from 'mysql2/promise';
            const options = { host: '127.0.0.1', port: 3306, user: 'root', password: 'ci-root' };
            for (let attempt = 1; ; attempt += 1) {
              try {
                const connection = await mysql.createConnection(options);
                await connection.query(
                  'ALTER DATABASE daybook_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci',
                );
                const [[server]] = await connection.query('SELECT VERSION() AS version');
                console.log('MySQL', server.version);
                await connection.end();
                break;
              } catch (error) {
                if (attempt >= 30) throw error;
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
            }
          "

      # NODE_ENV is left unset (development) so 018 prints its "018: rebuilt ... away breaks" line.
      - name: Migrate up from an empty database
        run: node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:latest

      # 020 first: 019's down can't drop project_files while task_file_links points at it.
      - name: Migrate down for 020, then 019
        run: |
          node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:down 020_task_file_links.js
          node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:down 019_project_files.js

      - name: Migrate up again after 019
        run: node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:latest

      - name: Migrate down for 018 only
        run: node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:down 018_hr_tools.js

      - name: Migrate up again after 018
        run: node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:latest

      - name: Migrate down for 020 only
        run: node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:down 020_task_file_links.js

      - name: Migrate up again
        run: |
          node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:latest
          node --disable-wasm-trap-handler node_modules/knex/bin/cli.js migrate:list

      - name: Migration 018 service test
        run: |
          if [ -f tests/services/migration018.test.js ]; then
            npx vitest run tests/services/migration018.test.js
          else
            echo "tests/services/migration018.test.js is not written yet; skipped."
          fi

      # Under Vitest NODE_ENV is test, so FILES_DIR is ignored (the 019 test never touches files).
      - name: Migration 019 service test
        run: npx vitest run tests/services/migration019.test.js

      - name: Migration 020 service test
        run: npx vitest run tests/services/migration020.test.js

      # The 1.13 reads (CONTRACT 28): every new grouped query and locking read meets MySQL 8.4's
      # default ONLY_FULL_GROUP_BY here before the live site, which MariaDB 10.4 doesn't check.
      # One file at a time on the same database (vitest.config.js: fileParallelism false); the
      # files kit keeps its files in a temp folder.
      - name: The 1.13 service tests on MySQL 8.4
        run: >-
          npx vitest run
          tests/services/projectFileLinks.test.js
          tests/services/projectFilesPicker.test.js
          tests/services/projectTasksMine.test.js
          tests/services/projectTasksBulk.test.js
          tests/services/projectTaskTake.test.js
          tests/services/taskMinutes.test.js
          tests/services/projectBoardTab.test.js
