<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook 1.10 HR tools prototype</title>
<!--
  Daybook 1.10 (CONTRACT section 25): the design for the new HR screens. Standalone: no network,
  no build. The colour tokens are copied from src/app/globals.css (keep them in step), the type
  from the next/font faces the app loads (the latin files and their metric-matched Arial
  fallbacks, at the end of this file), and every class below mirrors a CSS module in
  src/components or src/app/(app). The top bar (screens, states, light and dark) is demo only.
  Open a state directly: hr-tools-prototype.html#s=att&v=today&theme=dark&bar=0
-->
<style>
/* ===== Tokens: copied from src/app/globals.css ===== */
:root {
  --paper: light-dark(#f5f6fa, #0f1226);
  --surface: light-dark(#ffffff, #1a1e3a);
  --surface-muted: light-dark(#f8f9fc, #151935);
  --track: light-dark(#eef0f6, #252a4d);
  --line: light-dark(#e6e8f0, #2c3156);
  --line-strong: light-dark(#dcdfea, #363c66);
  --ink: light-dark(#1b1e33, #eceef7);
  --ink-2: light-dark(#3e4460, #cdd1e6);
  --muted: light-dark(#5b6178, #a0a5c3);
  --navy: light-dark(#151833, #0b0d1f);
  --navy-raised: light-dark(#20244a, #171a38);
  --navy-active: light-dark(#2d3272, #262b66);
  --navy-text: #c9cce0;
  --navy-muted: #9ea2c4;
  --navy-line: light-dark(#262a52, #1d2146);
  --primary: light-dark(#3848d6, #8c97ff);
  --primary-hover: light-dark(#2733a8, #a6aeff);
  --primary-soft: light-dark(#e7e9fb, #262b5c);
  --primary-text: light-dark(#26329a, #c3c9ff);
  --marigold: #ffb020;
  --marigold-ink: #3b2600;
  --marigold-soft: light-dark(#fff1d6, #3a2c10);
  --marigold-text: light-dark(#6b4500, #ffd48a);
  --green: #0c8a5b;
  --green-soft: light-dark(#e1f3eb, #12352a);
  --green-text: light-dark(#09633f, #7fd8b3);
  --red: #d12f3a;
  --red-soft: light-dark(#fbe3e4, #3d1a22);
  --red-text: light-dark(#9a1f28, #ff9aa3);
  --violet: #7b45d6;
  --violet-soft: light-dark(#eee7fa, #2c2350);
  --violet-text: light-dark(#55289f, #cdb5ff);
  --red-on-surface: light-dark(#d12f3a, #ff6b76);
  --violet-on-surface: light-dark(#7b45d6, #a985ff);
  --label-blue-bg: light-dark(#e7e9fb, #262b5c);
  --label-blue-text: light-dark(#26329a, #c3c9ff);
  --label-blue: #3848d6;
  --label-green-bg: light-dark(#e1f3eb, #12352a);
  --label-green-text: light-dark(#09633f, #7fd8b3);
  --label-green: #0c8a5b;
  --label-violet-bg: light-dark(#eee7fa, #2c2350);
  --label-violet-text: light-dark(#55289f, #cdb5ff);
  --label-violet: #7b45d6;
  --label-orange-bg: light-dark(#fdebdd, #3d2614);
  --label-orange-text: light-dark(#8a3f05, #ffbd85);
  --label-orange: #f07a1a;
  --label-teal-bg: light-dark(#ddf1f5, #0f3440);
  --label-teal-text: light-dark(#0d5f72, #8adcee);
  --label-teal: #1a9bb8;
  --label-pink-bg: light-dark(#fbe5ee, #3d1a2b);
  --label-pink-text: light-dark(#8e2350, #ffa3c4);
  --label-pink: #d6457a;
  --label-yellow-bg: light-dark(#f6f2c0, #32310f);
  --label-yellow-text: light-dark(#565000, #e5da69);
  --label-yellow: #d4b300;
  --urgent-bg: light-dark(#fff7e4, #2e2412);
  --urgent-line: light-dark(#f8e2b0, #4d3a17);
  --on-primary: light-dark(#ffffff, #0f1226);
  --on-fill: #ffffff;
  --line-dashed: light-dark(#c5c8d4, #454b7a);
  --switch-off: light-dark(#c9ccdb, #3d4370);
  --placeholder: light-dark(#757575, #7d82a3);
  --radius-tile: 12px;
  --radius-pill: 999px;
  --overlay: light-dark(rgba(21, 24, 51, 0.36), rgba(5, 6, 16, 0.6));
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary);
  /* next/font's variables (layout.js): the real face, then its metric-matched fallback */
  --font-heading: 'Schibsted Grotesk', 'Schibsted Grotesk Fallback';
  --font-body: 'Figtree', 'Figtree Fallback';
  --font-heading-stack: var(--font-heading), 'Schibsted Grotesk', system-ui, sans-serif;
  --font-body-stack: var(--font-body), 'Figtree', system-ui, sans-serif;
  --text-page-title: 30px;
  --text-card-title: 18px;
  --text-big-number: 34px;
  --text-body: 15px;
  --text-small: 13px;
  --text-tag: 12px;
  --sidebar-width: 240px;
  --main-padding-y: 28px;
  --main-padding-x: 32px;
  --block-gap: 22px;
  --radius-card: 16px;
  --radius-control: 10px;
  --radius-cell: 8px;
  --radius-label: 6px;
  --control-height: 44px;
  --control-height-compact: 40px;
  --status-cell-height: 34px;
  --pill-height: 36px;
  --label-height: 26px;
  --table-head-height: 40px;
  --table-row-height: 54px;
  --drawer-width: 460px;
}
:root { color-scheme: light; }
:root[data-theme='dark'] { color-scheme: dark; }

/* ===== Base (globals.css) ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-body-stack); font-size: var(--text-body); line-height: 1.45; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-heading-stack); color: var(--ink); }
p { margin: 0; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
img, svg { display: block; max-width: 100%; }
table { border-collapse: collapse; width: 100%; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.num { font-family: var(--font-heading-stack); font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ===== Prototype bar (demo only, not part of Daybook) ===== */
.proto { position: relative; z-index: 90; display: flex; flex-direction: column; gap: 8px; padding: 10px clamp(16px, 2.25vw, 32px); background: var(--surface); border-bottom: 1px solid var(--line); }
.proto-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.proto-name { margin-right: 6px; font-family: var(--font-heading-stack); font-size: 14px; font-weight: 700; color: var(--ink); }
.proto-btn { height: 32px; padding: 1px 12px 0; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; line-height: 1; white-space: nowrap; }
.proto-btn[aria-pressed='true'] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.proto-sub .proto-btn { height: 28px; font-size: 12px; font-weight: 500; }
.proto-themes { display: inline-flex; margin-left: auto; padding: 3px; border-radius: var(--radius-control); background: var(--track); }
.proto-theme { height: 28px; padding: 1px 12px 0; border: 0; border-radius: var(--radius-cell); background: transparent; color: var(--muted); font-size: 13px; }
.proto-theme[aria-pressed='true'] { background: var(--surface); color: var(--ink); font-weight: 600; }

/* ===== AppShell + Sidebar ===== */
.shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; background: var(--paper); }
.shell-side { min-width: 0; background: var(--navy); }
.sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; min-height: 0; padding: 22px 14px; overflow-y: auto; background: var(--navy); color: var(--navy-text); }
.brand { display: flex; flex: none; align-items: center; gap: 10px; height: 32px; margin-left: 8px; }
.brand-word { font-family: var(--font-heading-stack); font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: var(--on-fill); }
.workspace { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 8px; height: 54px; margin-top: 22px; padding: 0 12px; border-radius: 12px; background: var(--navy-raised); }
.workspace-text { display: flex; flex-direction: column; min-width: 0; margin-top: -1px; }
.workspace-label { font-size: 12px; line-height: 16px; color: var(--navy-muted); }
.workspace-name { overflow: hidden; font-size: 14px; font-weight: 600; line-height: 18px; color: var(--on-fill); white-space: nowrap; text-overflow: ellipsis; }
.workspace svg { flex: none; color: var(--on-fill); }
.nav { flex: none; margin-top: 22px; }
.nav-list { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.nav-item { display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 12px; border-radius: 10px; color: var(--navy-text); font-size: var(--text-body); line-height: 20px; text-decoration: none; }
.nav-item:hover { background: color-mix(in srgb, var(--navy-active) 45%, transparent); text-decoration: none; }
.nav-item:focus-visible { box-shadow: 0 0 0 2px var(--navy), 0 0 0 4px var(--primary); }
.nav-item.active { background: var(--navy-active); color: var(--on-fill); font-weight: 600; }
.nav-item svg { flex: none; }
.nav-label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.nav-badge { display: inline-flex; flex: none; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--marigold); color: var(--marigold-ink); font-family: var(--font-heading-stack); font-size: 12px; font-weight: 700; line-height: 1; }
.side-bottom { flex: none; margin-top: auto; padding-top: 16px; }
.chip { display: flex; align-items: center; gap: 8px; min-height: 46px; margin-bottom: 12px; padding: 7px 7px 7px 11px; border-radius: 12px; background: var(--navy-raised); }
.chip-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.chip-name { flex: 1 1 auto; min-width: 0; overflow: hidden; font-size: 14px; font-weight: 600; line-height: 20px; color: var(--on-fill); white-space: nowrap; text-overflow: ellipsis; }
.chip-time { flex: none; font-family: var(--font-heading-stack); font-size: 13px; font-weight: 600; line-height: 20px; color: var(--navy-text); font-variant-numeric: tabular-nums; }
.chip-stop { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: var(--navy-active); color: var(--on-fill); }
.chip-stop span { width: 10px; height: 10px; border-radius: 2px; background: var(--on-fill); }
.person { padding-top: 13px; border-top: 1px solid var(--navy-line); }
.person-row { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.person-av { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: var(--navy-active); color: var(--on-fill); font-size: 13px; font-weight: 600; line-height: 1; }
.person-text { display: flex; flex-direction: column; min-width: 0; margin-top: 3px; }
.person-name { font-size: 14px; font-weight: 600; line-height: 18px; color: var(--on-fill); }
.person-role { font-size: 13px; line-height: 18px; color: var(--navy-muted); }
.version { margin-top: 10px; padding: 0 8px; font-size: 12px; line-height: 16px; color: var(--navy-muted); }
.main { display: flex; flex-direction: column; gap: var(--block-gap); min-width: 0; padding: var(--main-padding-y) var(--main-padding-x); }

/* ===== TopBar, Breadcrumb ===== */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; min-width: 0; }
.tb-lead { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb-heading { display: flex; flex-direction: column; min-width: 0; }
.tb-title, .tb-sub { position: relative; top: 2px; }
.tb-title { font-family: var(--font-heading-stack); font-size: var(--text-page-title); font-weight: 700; line-height: 36px; letter-spacing: -0.02em; color: var(--ink); }
.tb-sub { margin-top: 1px; font-size: var(--text-body); line-height: 22px; color: var(--muted); }
.tb-actions { display: flex; flex: none; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
.tb-crumbs { margin-bottom: 1px; }
.menu-btn { display: none; }
.crumb-list { display: flex; flex-wrap: wrap; align-items: center; margin: 0; padding: 0; list-style: none; font-size: 14px; font-weight: 500; line-height: 20px; }
.crumb { display: inline-flex; align-items: center; gap: 6px; min-width: 0; margin-right: 6px; }
.crumb:last-child { margin-right: 0; }
.crumb a { color: var(--muted); }
.crumb a:hover { color: var(--ink); }
.crumb svg { flex: none; color: var(--muted); }
.crumb-current { color: var(--ink); }

/* ===== Card ===== */
.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
.pad { padding: var(--card-pad, 20px 24px); }
.pad-compact { padding: var(--card-pad, 16px 20px); }
.pad-none { padding: 0; }
.card-dark { background: var(--navy); border-color: var(--navy); color: var(--on-fill); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; min-width: 0; }
.card-head-divider { min-height: 54px; padding: 15px 20px; border-bottom: 1px solid var(--line); }
.card-title { margin: 0; font-family: var(--font-heading-stack); font-size: var(--text-card-title); font-weight: 600; line-height: 22px; color: var(--ink); }
.card-sub { margin-top: 1px; font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.card-actions { display: flex; flex-shrink: 0; align-items: center; gap: 10px; font-size: var(--text-small); color: var(--muted); }
.notice { --card-pad: 14px 20px; display: flex; align-items: flex-start; gap: 10px; }
.notice > svg { flex: none; margin-top: 1px; color: var(--muted); }
.notice-text { min-width: 0; font-size: 14px; line-height: 20px; color: var(--ink-2); }
.notice-more { margin-top: 2px; font-size: var(--text-small); line-height: 18px; color: var(--muted); }

/* ===== Kpi + ProgressBar ===== */
.kpi { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 18px 20px 17px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); color: inherit; }
.kpi-body { flex: 1 0 auto; }
.kpi-label { overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; color: var(--muted); white-space: nowrap; text-overflow: ellipsis; }
.kpi-trailing .kpi-label { padding-right: 22px; }
.kpi-chev { position: absolute; top: 18px; right: 16px; display: inline-flex; color: var(--muted); transition: transform 120ms ease, color 120ms ease; }
.kpi-row { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8.25px; margin-top: 6px; }
.kpi-value { font-family: var(--font-heading-stack); font-size: 32px; font-weight: 700; line-height: 36px; font-variant-numeric: tabular-nums; color: var(--ink); }
.kpi-sub { font-size: 14px; line-height: 20px; color: var(--muted); }
.kpi-foot { margin-top: 5px; font-size: 14px; line-height: 20px; color: var(--muted); }
.kpi .pb { margin-top: 8px; }
a.kpi-link { transition: border-color 120ms ease; }
a.kpi-link:hover { border-color: var(--line-dashed); text-decoration: none; }
a.kpi-link:hover .kpi-chev { color: var(--ink); transform: translateX(2px); }
.pb { position: relative; width: 100%; height: 8px; overflow: hidden; border-radius: var(--radius-pill); background: var(--track); }
.pb-fill { height: 100%; min-width: 8px; border-radius: var(--radius-pill); }
.fill-primary { background: var(--primary); }
.fill-violet { background: var(--violet); }
.fill-marigold { background: var(--marigold); }
.fill-red { background: var(--red); }
.fill-teal { background: var(--label-teal); }
.fill-green { background: var(--green); }

/* ===== DataTable ===== */
.dt-wrap { position: relative; width: 100%; overflow-x: auto; }
.dt { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.35; color: var(--ink); }
.dt th, .dt td { padding: 0 8px; text-align: left; vertical-align: middle; }
.dt th:first-child, .dt td:first-child { padding-left: 20px; }
.dt th:last-child, .dt td:last-child { padding-right: 20px; }
.dt thead th { height: var(--table-head-height); padding-top: 1px; border-bottom: 1px solid var(--track); background: var(--surface-muted); font-size: var(--text-small); font-weight: 600; line-height: 16px; color: var(--muted); white-space: nowrap; }
.dt td { height: var(--table-row-height); padding-top: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--track); }
.dt tbody tr:last-child td { border-bottom: 0; }
.dt .right { text-align: right; }
.dt .empty-row td { height: auto; padding: 0; border-bottom: 0; }
.fixed table, table.fixed { table-layout: fixed; }

/* ===== StatusCell ===== */
.status { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; margin: 0; border: 0; border-radius: var(--radius-cell); font-family: var(--font-body-stack); font-size: var(--text-small); font-weight: 600; line-height: 1; white-space: nowrap; text-align: center; }
.status-text { overflow: hidden; margin: 0 -2px; text-overflow: ellipsis; }
.status-cell { display: flex; width: 100%; height: var(--status-cell-height); padding: 0; }
.status-compact { display: flex; width: 100%; height: 30px; padding: 0; }
.st-primary { background: var(--primary); color: var(--on-primary); }
.st-violet { background: var(--violet); color: var(--on-fill); }
.st-marigold { background: var(--marigold); color: var(--marigold-ink); }
.st-red { background: var(--red); color: var(--on-fill); }
.st-green { background: var(--green); color: var(--on-fill); }
.st-neutral { background: var(--line); color: var(--ink-2); }
/* 1.10 (G): leave = teal, holiday = green, day off = neutral, soft fills (CONTRACT 25 Words) */
.st-teal-soft { background: var(--label-teal-bg); color: var(--label-teal-text); }
.st-green-soft { background: var(--green-soft); color: var(--green-text); }

/* ===== Tag, Badge ===== */
.tag { display: inline-flex; flex-shrink: 0; align-items: center; gap: 6px; max-width: 100%; border-radius: var(--radius-pill); font-family: var(--font-body-stack); font-weight: 600; line-height: 1; white-space: nowrap; vertical-align: middle; background: var(--tag-bg); color: var(--tag-text); }
.tag-sm { height: 22px; padding: 0 var(--tag-pad-x, 10px); font-size: var(--text-tag); }
.tag-md { height: 26px; padding: 0 var(--tag-pad-x, 10px); font-size: var(--text-tag); }
.tag-lg { height: 28px; padding: 0 var(--tag-pad-x, 10px); font-size: var(--text-small); }
.tag-xl { height: 30px; padding: 2px var(--tag-pad-x, 12px) 0; font-size: var(--text-small); }
.tag-xxl { height: 40px; gap: 8px; padding: 0 var(--tag-pad-x, 14px); font-size: 14px; }
.tag-dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--tag-strong); }
.tone-primary { --tag-bg: var(--primary-soft); --tag-text: var(--primary-text); --tag-strong: var(--primary); }
.tone-marigold { --tag-bg: var(--marigold-soft); --tag-text: var(--marigold-text); --tag-strong: var(--marigold); }
.tone-green { --tag-bg: var(--green-soft); --tag-text: var(--green-text); --tag-strong: var(--green); }
.tone-red { --tag-bg: var(--red-soft); --tag-text: var(--red-text); --tag-strong: var(--red); }
.tone-violet { --tag-bg: var(--violet-soft); --tag-text: var(--violet-text); --tag-strong: var(--violet); }
.tone-teal { --tag-bg: var(--label-teal-bg); --tag-text: var(--label-teal-text); --tag-strong: var(--label-teal); }
.tone-neutral { --tag-bg: var(--line); --tag-text: var(--ink-2); --tag-strong: var(--ink-2); }
.badge { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 2px 6px 0; border-radius: var(--radius-pill); background: var(--marigold); color: var(--marigold-ink); font-family: var(--font-body-stack); font-size: 13px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }

/* ===== Button, IconButton ===== */
.btn { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; gap: 8px; margin: 0; padding: var(--btn-pad-top, 0px) calc(var(--btn-pad-x) + var(--btn-pad-extra, 0px)) 0; border: 1px solid transparent; border-radius: var(--radius-control); font-family: var(--font-body-stack); font-size: var(--text-body); font-weight: 600; line-height: 1; white-space: nowrap; text-decoration: none; cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.btn:hover { text-decoration: none; }
.btn > svg { flex-shrink: 0; translate: 0 calc(var(--btn-pad-top, 0px) * -0.75); }
.btn-default { --btn-pad-x: 17px; --btn-pad-top: 2px; height: var(--control-height); }
.btn-compact { --btn-pad-x: 17px; height: var(--control-height-compact); }
.btn-small { --btn-pad-x: 17px; --btn-pad-top: 2px; height: 37px; }
.btn-large { --btn-pad-x: 25px; --btn-pad-top: 2px; height: 47px; font-size: 16px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-secondary { --btn-pad-extra: 1px; background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-muted); }
.btn-marigold { background: var(--marigold); color: var(--marigold-ink); }
.btn-danger { --btn-pad-extra: 0.5px; background: var(--surface); border-color: color-mix(in srgb, var(--red) 28%, var(--surface)); color: var(--red-text); }
.btn-danger:hover:not(:disabled) { background: var(--red-soft); }
.btn-text { height: auto; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--primary); line-height: 1.45; }
.btn-text.btn-compact { height: auto; font-size: 14px; }
.btn-text.btn-small { height: auto; font-size: var(--text-small); }
.btn-text:hover:not(:disabled) .btn-label { text-decoration: underline; text-underline-offset: 3px; }
.btn-text.text-danger { color: var(--red-text); }
.btn:disabled, .btn[aria-disabled='true'] { opacity: 0.5; cursor: not-allowed; }
.icon-btn { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; width: var(--control-height); height: var(--control-height); margin: 0; padding: 2px 0 0; border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); }
.icon-btn:hover { background: var(--surface-muted); }
.icon-btn .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }

/* ===== Field, Input, Select, Textarea, Toggle ===== */
.field { display: flex; flex-direction: column; min-width: 0; }
.field-label { margin-bottom: 4px; font-size: var(--text-small); font-weight: 600; line-height: 18px; color: var(--ink-2); }
.field-help { margin-top: 5px; font-size: var(--text-tag); line-height: 16px; color: var(--muted); }
.field-error { margin-top: 5px; font-size: var(--text-small); font-weight: 500; line-height: 18px; color: var(--red-text); }
.control { display: block; width: 100%; min-width: 0; height: var(--control-height); margin: 0; padding: 0 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-control); font-family: var(--font-body-stack); font-size: var(--text-body); line-height: 20px; color: var(--ink); transition: border-color 120ms ease; }
.control::placeholder { color: var(--placeholder); opacity: 1; }
.control:hover:not(:disabled):not(:read-only) { border-color: var(--muted); }
select.control:hover:not(:disabled) { border-color: var(--muted); }
.control:focus-visible { border-color: var(--primary); }
input.control { padding-top: 1px; }
.control.compact { height: var(--control-height-compact); padding: 0 10px; }
.control:disabled { background: var(--surface-muted); color: color-mix(in srgb, var(--muted) 75%, var(--surface-muted)); opacity: 1; cursor: not-allowed; }
.control[aria-invalid='true'] { border-color: var(--red); }
.control[aria-invalid='true']:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--red); }
select.control { cursor: pointer; text-overflow: ellipsis; }
textarea.control { height: auto; min-height: 88px; padding: 11px 13px; line-height: 22px; resize: vertical; }
textarea.control.rows-2 { min-height: 66px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-width: 0; cursor: pointer; }
.toggle-text { display: flex; flex-direction: column; min-width: 0; }
.toggle-label { font-size: var(--text-body); font-weight: 600; line-height: 20px; color: var(--ink); }
.toggle-help { font-size: var(--text-small); line-height: 17px; color: var(--muted); }
.toggle-ctl { position: relative; display: inline-flex; flex-shrink: 0; width: 44px; height: 26px; }
.toggle-ctl input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.toggle-track { position: relative; width: 44px; height: 26px; border-radius: var(--radius-pill); background: var(--switch-off); transition: background-color 150ms ease; pointer-events: none; }
.toggle-knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--on-fill); transition: transform 150ms ease; }
.toggle-ctl input:checked + .toggle-track { background: var(--primary); }
.toggle-ctl input:checked + .toggle-track .toggle-knob { transform: translateX(18px); }
.toggle-ctl input:focus-visible + .toggle-track { box-shadow: var(--focus-ring); }
.check { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); cursor: pointer; }
.check:disabled { cursor: not-allowed; }
.check-hit { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -13px; border-radius: 8px; cursor: pointer; }

/* ===== Segmented, FilterPills, DateSwitcher ===== */
.seg { display: inline-flex; flex-shrink: 0; align-items: center; gap: 2px; height: 40px; padding: 3px; background: var(--track); border-radius: var(--radius-control); }
.seg-item { display: inline-flex; align-items: center; justify-content: center; height: 34px; margin: 0; padding: 0 14px; background: transparent; border: 0; border-radius: var(--radius-cell); font-family: var(--font-body-stack); font-size: var(--text-small); font-weight: 500; line-height: 1; white-space: nowrap; color: var(--muted); text-decoration: none; cursor: pointer; }
.seg-item:hover { color: var(--ink); text-decoration: none; }
.seg-item.selected { background: var(--surface); color: var(--ink); font-weight: 600; }
/* 1.10 (G): a disabled item, text --muted at 50%, no hover */
.seg-item:disabled, .seg-item[aria-disabled='true'] { color: color-mix(in srgb, var(--muted) 50%, transparent); cursor: not-allowed; }
.seg-full { display: flex; }
.seg-full .seg-item { flex: 1 1 0; }
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.pill { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; height: var(--pill-height); margin: 0; padding: 0 13.5px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-pill); font-family: var(--font-body-stack); font-size: var(--text-small); font-weight: 500; line-height: 1; white-space: nowrap; color: var(--ink); text-decoration: none; cursor: pointer; }
.pill:hover { background: var(--surface-muted); text-decoration: none; }
.pill.selected, .pill.selected:hover { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
.ds { display: inline-flex; flex-shrink: 0; align-items: center; gap: 11.5px; height: var(--control-height); padding: 0 6px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-control); }
.ds-step { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-cell); color: var(--ink); }
a.ds-step:hover { background: var(--track); text-decoration: none; }
.ds-step[aria-disabled='true'] { color: var(--line-strong); cursor: not-allowed; }
.ds-label { font-size: var(--text-body); font-weight: 600; line-height: 20px; white-space: nowrap; color: var(--ink); }

/* ===== Menu ===== */
.menu-trigger { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
.menu-trigger:hover, .menu-trigger[aria-expanded='true'] { background: var(--surface-muted); color: var(--ink); }
.menu-pop { position: absolute; z-index: 80; display: flex; flex-direction: column; min-width: 196px; max-width: calc(100vw - 16px); padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 12px 32px color-mix(in srgb, var(--navy) 14%, transparent); }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font-size: 14px; line-height: 20px; text-align: left; white-space: nowrap; }
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-muted); }
.menu-item:focus-visible { box-shadow: inset 0 0 0 2px var(--primary); }
.menu-item.danger { color: var(--red-text); }
.menu-icon { display: inline-flex; flex: none; color: var(--muted); }
.menu-item.danger .menu-icon { color: inherit; }

/* ===== Avatar, EmptyState, Skeleton ===== */
.avatar { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; overflow: hidden; border-radius: 50%; font-family: var(--font-body-stack); font-weight: 600; line-height: 1; white-space: nowrap; user-select: none; background: var(--av-bg); color: var(--av-text); }
.av-blue { --av-bg: var(--primary-soft); --av-text: var(--primary-text); }
.av-violet { --av-bg: var(--violet-soft); --av-text: var(--violet-text); }
.av-green { --av-bg: var(--green-soft); --av-text: var(--green-text); }
.av-teal { --av-bg: var(--label-teal-bg); --av-text: var(--label-teal-text); }
.av-orange { --av-bg: var(--label-orange-bg); --av-text: var(--label-orange-text); }
.av-red { --av-bg: var(--red-soft); --av-text: var(--red-text); }
.av-pink { --av-bg: var(--label-pink-bg); --av-text: var(--label-pink-text); }
.av-ink { --av-bg: var(--navy); --av-text: var(--on-fill); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
.empty-compact { padding: 24px 20px; }
.empty-icon { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-bottom: 14px; border-radius: 50%; background: var(--track); color: var(--muted); }
.empty-title { font-family: var(--font-heading-stack); font-size: 16px; font-weight: 600; line-height: 22px; color: var(--ink); }
.empty-body { max-width: 360px; margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--muted); }
.empty-action { margin-top: 16px; font-size: var(--text-small); font-weight: 600; }

/* ===== Dialog ===== */
.dlg-root { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.dlg-overlay { position: absolute; inset: 0; background: var(--overlay); }
.dlg-panel { position: relative; display: flex; flex-direction: column; width: min(var(--dialog-w, 480px), 100%); max-height: calc(100vh - 48px); border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); box-shadow: 0 24px 64px color-mix(in srgb, var(--navy) 18%, transparent); }
.dlg-panel:focus { outline: none; }
.dlg-head { display: flex; flex: none; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0; }
.dlg-heading { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-top: 5px; }
.dlg-title { font-family: var(--font-body-stack); font-size: 20px; font-weight: 600; line-height: 26px; color: var(--ink); }
.dlg-title:focus { outline: none; }
.dlg-desc { font-size: var(--text-body); line-height: 1.45; color: var(--muted); }
.dlg-close { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--ink); }
.dlg-close:hover { background: var(--surface-muted); }
.dlg-body { min-height: 0; padding: 18px 24px 4px; overflow-y: auto; overscroll-behavior: contain; }
.dlg-foot { display: flex; flex: none; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 18px; padding: 18px 24px; border-top: 1px solid var(--line); }
.dlg-foot .foot-start { margin-right: auto; }
.fields { display: flex; flex-direction: column; gap: 16px; }
.fields-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }

/* ===== Toast ===== */
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 70; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.toast { display: flex; align-items: flex-start; gap: 12px; width: 360px; max-width: calc(100vw - 32px); padding: 14px 12px 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 12px 32px color-mix(in srgb, var(--navy) 14%, transparent); }
.toast > svg { flex: none; margin-top: 1px; color: var(--green); }
.toast.error { border-color: color-mix(in srgb, var(--red) 30%, var(--line)); }
.toast.error > svg { color: var(--red); }
.toast.plain > svg { color: var(--muted); }
.toast-text { flex: 1; min-width: 0; }
.toast-title { font-size: var(--text-body); font-weight: 600; line-height: 22px; color: var(--ink); }
.toast-body { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--muted); }
.toast-close { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 28px; height: 28px; margin: -3px 0; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }

/* ===== Shared cells (Attendance day, person month, lists) ===== */
.person-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pc-text { display: flex; flex-direction: column; min-width: 0; }
.pc-name { overflow: hidden; font-weight: 500; line-height: 19px; color: var(--ink); white-space: nowrap; text-overflow: ellipsis; }
a.pc-name { color: var(--ink); text-decoration: none; }
a.pc-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.pc-role { overflow: hidden; font-size: var(--text-small); line-height: 17px; color: var(--muted); white-space: nowrap; text-overflow: ellipsis; }
.stack { position: relative; top: -1px; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.check-time { font-family: var(--font-heading-stack); font-size: 16px; font-weight: 600; line-height: 20px; font-variant-numeric: tabular-nums; color: var(--ink); }
.late { margin-top: 2px; font-size: 12px; font-weight: 600; line-height: 15px; color: var(--marigold-text); white-space: nowrap; }
.breaks { margin-top: 2px; font-size: 12px; font-weight: 600; line-height: 15px; color: var(--muted); white-space: nowrap; }
/* 1.10: every new muted line (12 px, may take 2 lines, never nowrap) */
.mline { margin-top: 2px; font-size: 12px; line-height: 15px; color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
.mline.alert { color: var(--marigold-text); font-weight: 600; }
.mline.red { color: var(--red-text); font-weight: 600; }
.mline.marigold { color: var(--marigold-text); font-weight: 600; }
.cell-tag { height: 20px; margin-top: 3px; }
.tags-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; margin-top: 3px; }
.tags-wrap .cell-tag { margin-top: 0; }
.time { font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
.missing { font-size: var(--text-small); font-weight: 600; color: var(--red-text); }
.dash { color: var(--ink); }
.muted { color: var(--muted); }
.note { display: -webkit-box; overflow: hidden; font-size: 14px; line-height: 19px; color: var(--muted); overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
/* B: the Present cell as the break list's button */
.breaks-btn { position: relative; top: -1px; display: flex; flex-direction: column; align-items: flex-start; margin: 0; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--ink); font: inherit; text-align: left; }
.breaks-btn:hover .time { text-decoration: underline; text-underline-offset: 3px; }
.where { position: relative; top: -1px; display: flex; flex-direction: column; min-width: 0; }
/* the Action column: one line (RowAction + RowMenu), the ReminderNote under it */
.act { display: flex; flex-direction: column; min-width: 0; }
.act-line { display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 36px; }
.act-line .menu-trigger { margin-right: -8px; }
.act-line .btn-small { min-width: 57px; }
.remind-note { display: -webkit-box; margin-top: 1px; overflow: hidden; font-size: 12px; line-height: 15px; color: var(--muted); overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.num-cell { font-family: var(--font-heading-stack); font-size: 16px; font-weight: 600; line-height: 20px; font-variant-numeric: tabular-nums; color: var(--ink); }
.num-red { color: var(--red-text); }
.text-btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }

/* ===== Attendance day (page.module.css) ===== */
.page { display: flex; flex-direction: column; gap: var(--block-gap); min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.att-main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.att-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.side-act, .side-info { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.everyone { min-width: 0; overflow: hidden; }
.att-table table { table-layout: fixed; }
.everyone-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; min-height: 69px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.head-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 12px; min-width: 0; }
.corrections { --card-pad: 20px 24px 19px; }
.correction-list { display: flex; flex-direction: column; gap: 13px; margin: 14px 0 0; padding: 0; list-style: none; }
.correction { display: flex; flex-direction: column; padding: 15px 14px 14px; border-radius: var(--radius-tile); background: var(--surface-muted); }
.correction-person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.correction-name { overflow: hidden; font-size: 14px; font-weight: 600; line-height: 20px; color: var(--ink); white-space: nowrap; text-overflow: ellipsis; }
.correction-title { margin-top: 8px; font-size: 15px; font-weight: 600; line-height: 22px; color: var(--ink); overflow-wrap: anywhere; }
.correction-text { margin-top: 8px; font-size: 14px; line-height: 18px; color: var(--muted); }
.correction-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.side-foot { margin-top: 16px; font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.side-empty { margin-top: 12px; font-size: 14px; line-height: 20px; color: var(--muted); }
/* C: Missing check-outs card */
.missing-card { --card-pad: 20px 24px 18px; }
.missing-list { display: flex; flex-direction: column; gap: 14px; margin: 12px 0 0; padding: 0; list-style: none; }
.missing-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.missing-text { display: flex; flex-direction: column; min-width: 0; }
.missing-title { font-size: 14px; font-weight: 600; line-height: 20px; color: var(--ink); }
.missing-sub { font-size: 13px; line-height: 19px; color: var(--muted); }
.missing-asked { flex: none; font-size: 13px; line-height: 18px; color: var(--muted); white-space: nowrap; }
.card-link { display: inline-flex; margin-top: 16px; font-size: 14px; font-weight: 600; line-height: 20px; }
/* E: Needs a look this month */
.look-list { display: flex; flex-direction: column; gap: 12px; margin: 14px 0 0; padding: 0; list-style: none; }
.look-item { display: flex; align-items: flex-start; gap: 10px; }
.look-item .avatar { margin-top: 1px; }
.look-text { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; padding-top: 5px; }
.look-text a { font-size: 14px; font-weight: 600; line-height: 20px; color: var(--ink); }
.look-text a:hover { text-decoration: underline; text-underline-offset: 3px; }
/* F: Leave and holidays */
.leave-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 0; padding: 0; list-style: none; }
.leave-item { display: flex; align-items: center; gap: 10px; min-width: 0; }
.leave-text { display: flex; flex-direction: column; min-width: 0; }
.leave-name { font-size: 14px; font-weight: 600; line-height: 20px; color: var(--ink); }
.leave-sub { font-size: 13px; line-height: 18px; color: var(--muted); }
.side-h { margin-top: 16px; font-size: var(--text-small); font-weight: 600; line-height: 18px; color: var(--ink-2); }
.side-lines { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 14px; line-height: 20px; color: var(--ink); }
.side-muted { margin-top: 14px; font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.side-buttons { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--track); }

/* ===== B: break list dialog ===== */
.bl-list { margin: 0; padding: 0; list-style: none; }
.bl-row { padding: 12px 0; border-bottom: 1px solid var(--track); }
.bl-row:first-child { padding-top: 0; }
.bl-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bl-range { font-size: 15px; font-weight: 600; line-height: 22px; font-variant-numeric: tabular-nums; color: var(--ink); }
.bl-min { flex: none; font-family: var(--font-heading-stack); font-size: 15px; font-weight: 600; line-height: 22px; font-variant-numeric: tabular-nums; color: var(--ink); }
.bl-min.open { color: var(--marigold-text); }
.bl-label { margin-top: 1px; font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.bl-actions { display: flex; gap: 18px; margin-top: 6px; }
.bl-form { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; padding: 14px; border-radius: var(--radius-tile); background: var(--surface-muted); }
.bl-form-q { font-size: 14px; font-weight: 600; line-height: 20px; color: var(--ink); }
.bl-form-buttons { display: flex; align-items: center; gap: 16px; }
.bl-foot { margin-top: 14px; font-size: var(--text-small); line-height: 18px; color: var(--muted); }

/* ===== C: missing check-outs page ===== */

.bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }

.ms-table .sel-cell { width: 58px; }
.out-input { width: 120px; padding: 0 6px 0 9px; }
.out-input::-webkit-calendar-picker-indicator { margin-left: 0; }
.out-input::-webkit-datetime-edit { padding: 0; }
.row-error { margin-top: 4px; font-size: 12px; font-weight: 500; line-height: 15px; color: var(--red-text); white-space: normal; }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 20px; border-top: 1px solid var(--line); font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.pager-links { display: flex; gap: 18px; font-size: 14px; font-weight: 600; }

.fix-list { display: flex; flex-direction: column; gap: 6px; margin: 0 0 16px; padding: 12px 14px; border-radius: var(--radius-control); background: var(--surface-muted); list-style: none; font-size: 14px; line-height: 20px; color: var(--ink); }
.fix-list .muted { color: var(--muted); }

/* ===== E: month page and person month ===== */
.month-table table { table-layout: auto; }
.month-table td { padding-top: 12px; padding-bottom: 10px; vertical-align: top; }
.month-table .person-cell { align-items: flex-start; }
.look-tag { margin-top: 4px; }
.month-foot { padding: 14px 20px 16px; border-top: 1px solid var(--line); font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.pm-profile { --card-pad: 23px 25px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px 24px; }
.pm-who { display: flex; flex: 0 0 auto; align-items: center; gap: 16px; min-width: 0; }
.pm-who-text { display: flex; flex-direction: column; font-size: 14px; line-height: 20px; color: var(--muted); }
.pm-who-text strong { font-weight: 500; color: var(--ink); }
.pm-stats { display: grid; flex: 1 1 100%; grid-template-columns: repeat(6, minmax(0, 1fr)); margin: 0; padding-top: 18px; border-top: 1px solid var(--track); }
.pm-stat { min-width: 0; padding: 2px 16px; border-left: 1px solid var(--line); }
.pm-stat:first-child { padding-left: 0; border-left: 0; }
.pm-stat-value { font-family: var(--font-heading-stack); font-size: 26px; font-weight: 700; line-height: 32px; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.pm-stat-value small { font-size: 16px; font-weight: 600; color: var(--muted); }
.pm-stat-label { margin-top: 2px; font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.pm-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.pm-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.days-table td { padding-top: 10px; padding-bottom: 8px; }
.cal { --card-pad: 22px 24px 20px; }
.cal-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.cal-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 7.33px; }
.cal-weekday { margin-bottom: -2px; font-size: 12px; font-weight: 600; line-height: 16px; color: var(--muted); text-align: center; }
.cal-tile, .cal-empty { display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 10px; }
.cal-tile { font-family: var(--font-heading-stack); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; background: var(--surface-muted); color: var(--ink-2); }
.t-office { background: var(--primary-soft); color: var(--primary-text); }
.t-wfh { background: var(--violet-soft); color: var(--violet-text); }
.t-late { background: var(--marigold-soft); color: var(--marigold-text); }
.t-missing { background: var(--red-soft); color: var(--red-text); }

.t-today { border: 2px solid var(--primary); background: var(--surface); color: var(--primary-text); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 15px 0 0; padding: 0; list-style: none; font-size: 13px; line-height: 18px; color: var(--muted); }
.cal-legend li { display: inline-flex; align-items: center; gap: 6px; }
.cal-dot { width: 10px; height: 10px; border-radius: 3px; }
.d-office { background: var(--primary); }
.d-wfh { background: var(--violet); }
.d-late { background: var(--marigold); }
.d-missing { background: var(--red); }
.d-leave { background: var(--label-teal); }
.d-holiday { background: var(--green); }
.changes { --card-pad: 22px 24px 20px; }
.change-list { display: flex; flex-direction: column; margin: 12px 0 0; padding: 0; list-style: none; }
.change { padding: 12px 0; border-top: 1px solid var(--track); }
.change:first-child { padding-top: 4px; border-top: 0; }
.change-title { font-size: 14px; font-weight: 600; line-height: 20px; color: var(--ink); }
.change-detail { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--ink-2); }

/* ===== F: holidays, leave ===== */
.filter-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.filter-row .field { width: 260px; max-width: 100%; }
.preview { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: var(--radius-control); background: var(--surface-muted); }
.preview-main { font-size: 14px; font-weight: 600; line-height: 20px; color: var(--ink); }
.preview-note { font-size: 13px; line-height: 18px; color: var(--muted); }
.preview-note.warn { font-weight: 600; color: var(--marigold-text); }
.preview-note.bad { font-weight: 600; color: var(--red-text); }
.live-line { margin-top: -6px; font-size: 13px; line-height: 18px; color: var(--muted); }

/* ===== Today ===== */
.row-day { display: grid; grid-template-columns: minmax(0, 1fr) 373px; gap: 18px; align-items: stretch; }
.your-day { --card-pad: 22px 26px 33px; }
.day-bar { margin-top: 15px; }
.db-bar { position: relative; padding: 5.5px 0; }
.db-track { position: relative; height: 18px; overflow: hidden; border-radius: 999px; background: var(--track); }
.db-fill { position: absolute; top: 0; bottom: 0; min-width: 2px; border-radius: 999px; background: var(--primary); }
.db-now { position: absolute; top: 0; bottom: 0; width: 2px; border-radius: 1px; background: var(--ink); }
.db-report { position: absolute; top: 0; right: 0; bottom: 0; width: 6px; border-radius: 3px; background: var(--marigold); }
.db-labels { position: relative; height: 20px; margin-top: 3.5px; font-size: 13px; line-height: 20px; color: var(--muted); }
.db-label { position: absolute; top: 0; white-space: nowrap; }
.db-center { transform: translateX(-50%); }
.db-end { right: 0; }
.db-strong { font-weight: 600; color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 22px; }
.tile { min-width: 0; padding: 14px 16px 13px; background: var(--paper); border-radius: var(--radius-tile); }
.tile-value { font-family: var(--font-heading-stack); font-size: 26px; font-weight: 700; line-height: 32px; font-variant-numeric: tabular-nums; color: var(--ink); }
.tile-label { margin-top: 3px; font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.week { --card-pad: 22px 25px 20px; }
.week-bars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; margin: 15px -6px 0; }
.wb-day { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.wb-track { position: relative; width: 34px; max-width: 100%; height: 110px; overflow: hidden; border-radius: 8px; background: var(--track); }
.wb-fill { position: absolute; right: 0; bottom: 0; left: 0; background: var(--primary); }
.wb-label { margin-top: 6px; font-size: 13px; line-height: 18px; color: var(--muted); white-space: nowrap; }
.wb-label.today { font-weight: 600; color: var(--ink); }
.wb-value { margin-top: 5px; font-size: 13px; font-weight: 600; line-height: 18px; color: var(--ink); white-space: nowrap; }
.wb-value.none, .wb-value.faded { font-weight: 400; color: var(--muted); }
.checkin { --card-pad: 22px 26px 24px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 20px 0 0; padding: 0; border: 0; }
.choice { position: relative; display: flex; align-items: center; gap: 14px; min-width: 0; min-height: 80px; padding: 16px 18px; border: 1px solid var(--line-strong); border-radius: var(--radius-tile); background: var(--surface); cursor: pointer; }
.choice.checked { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
.choice-icon { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--paper); color: var(--ink-2); }
.choice.checked .choice-icon { background: var(--primary); color: var(--on-primary); }
.choice-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.choice-title { font-family: var(--font-heading-stack); font-size: 17px; font-weight: 600; line-height: 22px; color: var(--ink); }
.choice.checked .choice-title { color: var(--primary-text); }
.choice-hint { font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.checkin-bottom { display: flex; align-items: flex-start; gap: 16px; margin-top: 18px; }
.checkin-bottom .field { flex: 1 1 auto; }
.checkin-bottom textarea { min-height: 66px; }
.checkin-submit { flex: none; min-width: 160px; margin-top: 41px; }
.timer-card { --card-pad: 22px 26px 22px; }
.tw-total { font-size: var(--text-small); line-height: 18px; color: var(--muted); white-space: nowrap; }
.tw-total strong { font-family: var(--font-heading-stack); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.tw-running { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px 24px; min-height: 72px; margin-top: 16px; padding: 12px 14px 12px 18px; border-radius: var(--radius-tile); background: var(--paper); }
.tw-what { display: flex; align-items: center; gap: 12px; min-width: 0; }
.live-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.plabel { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border-radius: var(--radius-label); font-weight: 600; line-height: 1; white-space: nowrap; background: var(--label-blue-bg); color: var(--label-blue-text); }
.plabel-md { height: var(--label-height); padding: 0 10px; font-size: var(--text-small); }
.plabel-lg { height: 40px; gap: 10px; padding: 0 10px 0 13px; border-radius: var(--radius-control); font-family: var(--font-heading-stack); font-size: 16px; }
.tw-task { min-width: 0; overflow: hidden; font-size: var(--text-body); white-space: nowrap; text-overflow: ellipsis; }
.tw-elapsed { font-family: var(--font-heading-stack); font-size: 28px; font-weight: 700; line-height: 34px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.tw-buttons { display: flex; gap: 10px; }
.te { margin-top: 20px; }
.te-head { margin-bottom: 4px; font-family: var(--font-body-stack); font-size: var(--text-small); font-weight: 600; line-height: 18px; color: var(--ink-2); }
.te-list { margin: 0; padding: 0; list-style: none; }
.te-row { display: grid; grid-template-areas: 'range project what minutes menu'; grid-template-columns: 104px minmax(0, 190px) minmax(0, 1fr) 76px 36px; align-items: center; gap: 4px 16px; min-height: 52px; padding: 7px 0; border-bottom: 1px solid var(--track); }
.te-range, .te-min { font-family: var(--font-heading-stack); font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.te-range { grid-area: range; }
.te-min { grid-area: minutes; font-weight: 600; text-align: right; }
.te-project { display: flex; grid-area: project; min-width: 0; }
.te-what { grid-area: what; min-width: 0; overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap; text-overflow: ellipsis; }
.te-row .menu-trigger { grid-area: menu; justify-self: end; }
/* B: the removed-time row, muted, with Put back where the menu is */
.te-removed { grid-template-areas: 'range what what minutes menu'; }
.te-removed .te-range, .te-removed .te-min { color: var(--muted); }
.te-removed .te-what { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 16px; font-weight: 400; color: var(--muted); white-space: normal; }
.te-back { flex: none; }
.te-foot { display: flex; margin-top: 10px; }
.strip { --card-pad: 18px 25px 19px 26px; display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; }
.strip-title { font-size: 19px; font-weight: 600; line-height: 24px; color: var(--on-fill); }
.strip-body { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--navy-text); }
.strip .btn { min-width: 199px; }
.help { display: flex; flex-direction: column; gap: 4px; margin-top: -6px; }
.help-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: var(--text-small); line-height: 20px; color: var(--muted); }
.help-text .btn-text { font-size: var(--text-small); }
.help-dot { margin: 0 4px; }
/* C: the missing check-out pop-up */
.mc-in { margin-bottom: 16px; font-size: 14px; line-height: 20px; color: var(--muted); }
.mc-box { padding: 10px 12px; border-radius: 10px; background: var(--marigold-soft); color: var(--marigold-text); font-size: 14px; font-weight: 500; line-height: 20px; }
.mc-count { margin-right: auto; font-size: var(--text-small); line-height: 18px; color: var(--muted); }
.away-help { font-size: var(--text-small); line-height: 18px; color: var(--muted); }

/* ===== Settings ===== */
.set-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.set-nav { position: sticky; top: var(--main-padding-y); padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); }
.set-nav ul { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.set-nav a { display: flex; align-items: center; min-height: 40px; padding: 1px 12px 0; border-radius: var(--radius-control); font-size: 14px; line-height: 20px; color: var(--ink-2); }
.set-nav a:hover { background: var(--surface-muted); color: var(--ink); text-decoration: none; }
.set-nav a.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.sections { display: flex; flex-direction: column; gap: 19px; min-width: 0; }
.section { --card-pad: 22px 24px 21.5px; }
.section .card-sub { position: relative; top: 1px; font-size: 14px; }
.section-body { display: flex; flex-direction: column; margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18.67px 16px; align-items: start; }
.toggles { display: flex; flex-direction: column; margin-top: 16px; }
.toggles.first { margin-top: 0; }
.toggle-group { display: flex; flex-direction: column; padding: 13.75px 0; border-top: 1px solid var(--track); }
.toggles.first .toggle-group:first-child { padding-top: 0; border-top: 0; }
.toggle-field { width: calc(50% - 8px); margin-top: 14px; }
.after-toggles { padding-top: 16px; border-top: 1px solid var(--track); }

/* ===== Below 1440 px: the side cards split around the day table (CONTRACT 25) ===== */
@media (max-width: 1439px) {
  .att-main { grid-template-columns: minmax(0, 1fr); }
  .att-side { display: contents; }
  .side-act { order: -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
  .side-info { order: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
}
@media (max-width: 1279px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pm-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 16px; }
  .pm-stat:nth-child(4) { padding-left: 0; border-left: 0; }
}
@media (max-width: 1180px) {
  .row-day { grid-template-columns: minmax(0, 1fr); }
}

/* ===== Below 1024 px: drawer sidebar, stacked tables ===== */
@media (max-width: 1023px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .shell-side { display: none; }
  .main { gap: 18px; padding: 20px 24px 32px; }
  .menu-btn { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); }
  .topbar { flex-wrap: wrap; align-items: flex-start; }
  .tb-lead { flex: 1 1 100%; align-items: flex-start; }
  .tb-title { font-size: 24px; line-height: 30px; }
  .tb-sub { font-size: 14px; line-height: 20px; }
  .tb-actions { flex: 1 1 100%; flex-wrap: wrap; justify-content: flex-start; gap: 10px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .everyone-head { padding: 14px 16px; }
  .head-tools { justify-content: flex-start; }
  .att-table table, .month-table table { table-layout: auto; }
  .dt-wrap { overflow-x: visible; }
  .dt, .dt tbody, .dt tr, .dt td { display: block; width: 100%; }
  .dt thead, .dt colgroup { display: none; }
  .dt tbody tr { padding: 12px 16px; border-bottom: 1px solid var(--track); }
  .dt tbody tr:last-child { border-bottom: 0; }
  .dt td, .dt td:first-child, .dt td:last-child, .dt .right { display: grid; grid-template-columns: minmax(88px, 36%) minmax(0, 1fr); align-items: center; gap: 12px; height: auto; padding: 5px 0; border-bottom: 0; text-align: left; }
  .month-table td, .days-table td { padding: 5px 0; }
  .dt td::before { content: attr(data-label); font-size: var(--text-small); line-height: 18px; color: var(--muted); }
  .dt td:not([data-label]), .dt td:first-child { grid-template-columns: minmax(0, 1fr); }
  .dt td:not([data-label])::before, .dt td:first-child::before { content: none; }
  .dt td:has(> .cell:empty) { display: none; }
  .dt td:first-child { padding-bottom: 8px; }
  .dt .empty-row td, .dt .empty-row td:first-child { display: block; padding: 0; }
  /* C: the checkbox at the card's top left */
  .ms-table td.sel-cell { position: absolute; top: 15px; left: 16px; display: block; width: auto; padding: 0; }
  .ms-table tbody tr { position: relative; }
  .ms-table td.sel-cell + td { grid-template-columns: minmax(0, 1fr); padding-left: 34px; }
  .ms-table td.sel-cell + td::before { content: none; }
  .bulk-on .bulk { position: fixed; right: 0; bottom: 0; left: 0; z-index: 40; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); }
  .bulk-on .main { padding-bottom: 96px; }
  .pm-grid { grid-template-columns: minmax(0, 1fr); }
  .pm-right { display: contents; }
  .pm-days { order: 2; }
  .cal { order: 1; }
  .changes { order: 3; }
  .pm-stat { padding: 2px 12px; }
  .set-layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .set-nav { position: static; padding: 6px; overflow-x: auto; }
  .set-nav ul { flex-direction: row; gap: 4px; }
  .set-nav a { min-height: 36px; white-space: nowrap; }
  .look-text { flex-direction: column; align-items: flex-start; }
  /* Today: the cards in CONTRACT 24's order */
  .row-day { display: contents; }
  .your-day, .checkin { order: 1; }
  .timer-card { order: 2; }
  .week { order: 5; }
  .strip { order: 7; }
  .help { order: 8; }
}
@media (max-width: 640px) {
  .main { padding: 16px 16px 28px; }
  .tb-hide-phone { display: none; }
  .pm-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pm-stat:nth-child(odd) { border-left: 0; padding-left: 0; }
  .pm-stat:nth-child(even) { padding-right: 0; padding-left: 12px; border-left: 1px solid var(--line); }
  .fields-2, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .toggle-field { width: 100%; }
  .control { font-size: 16px; }
  .out-input { width: 136px; } /* 16 px text on phones needs the room */
  .row-day { grid-template-columns: minmax(0, 1fr); }
  .choices { grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 16px; }
  .checkin-bottom { flex-direction: column; align-items: stretch; }
  .checkin-submit { width: 100%; margin-top: 0; }
  .your-day, .checkin { --card-pad: 18px 16px 20px; }
  .tiles { gap: 8px; margin-top: 18px; }
  .tile { padding: 10px 10px 9px; }
  .tile-value { font-size: 18px; line-height: 24px; white-space: nowrap; }
  .tile-label { font-size: 12px; line-height: 16px; }
  .week, .strip { --card-pad: 18px 16px; }
  .db-wide { display: none; }
  .timer-card { --card-pad: 18px 16px 16px; }
  .tw-running { grid-template-columns: minmax(0, 1fr) auto; align-items: start; padding: 12px 12px 12px 14px; }

/* ===================================================================================== */

function btn(label, { v = 'primary', size = 'default', ic, act, data = '', cls = '', aria, type = 'button', disabled, attrs = '' } = {}) {
  const icHtml = ic ? icon(ic, v === 'text' ? 16 : 18) : '';

}

const STATUS = {

function statusCell(status, { title, size = 'status-compact' } = {}) {

}

}

}

function missingFixDialog() {
  const rows = S.ui.sel.map((id) => MISSING.find((m) => m.id === id));
  const lines = rows.map((m) => {
    const val = S.ui.vals[m.id] ?? m.val;
    const clock = formatClock(val);
    const suggested = m.sug && clock === m.sug;
    return `<li>${esc(P[m.p].name)}, ${esc(m.day)}: ${esc(clock)}${suggested ? '<span class="muted">, suggested</span>' : ''}</li>`;
  });
  const allSuggested = rows.every((m) => m.sug && formatClock(S.ui.vals[m.id] ?? m.val) === m.sug);
  const n = rows.length;
  return dialog({
    title: n === 1 ? `Fix ${P[rows[0].p].name}'s check-out` : `Fix ${n} check-outs`, w: 520,
    desc: 'Each one is saved with the time in its row. The person is told.',
    body: `<ul class="fix-list">${lines.join('')}</ul>${field('Reason', textarea('mf-reason', { value: allSuggested ? "Used Daybook's suggested time." : '', autofocus: true }), { id: 'mf-reason', help: 'Saved with each change in the audit log.' })}`,
    footer: `${btn('Cancel', { v: 'secondary', act: 'close' })}${btn(n === 1 ? 'Save' : `Fix ${n} check-outs`, { act: 'bulkdone' })}`,
  });
}
function formatClock(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
}

  const d = S.ui.dialog;
  const dlg = d ? DIALOGS[d.type](d) : '';
  const bulk = S.s === 'missing' && S.ui.sel.filter((id) => !S.ui.removedGone.includes(id)).length > 0;
  document.body.className = [d ? 'dlg-open' : '', bulk ? 'bulk-on' : ''].join(' ');
  app.innerHTML = `${protoBar()}<div class="shell">${sidebar(sh)}<main class="main" id="main">${PAGES[S.s]()}</main></div>${dlg}${menuPopup()}${toastHtml()}`;
  document.querySelectorAll('[data-indeterminate]').forEach((el) => { el.indeterminate = true; });
  placeMenu();
  const key = d ? JSON.stringify(d) : null;
  if (d && key !== lastDialogKey) {
    const target = document.querySelector('.dlg-panel [data-autofocus]') || document.querySelector('.dlg-panel');
    if (target) target.focus({ preventScroll: true });
  } else if (keep && document.getElementById(keep)) {
    document.getElementById(keep).focus({ preventScroll: true });
  }
  lastDialogKey = key;
}
function placeMenu() {
  const pop = document.getElementById('menu-pop');
  if (!pop) return;
  const trigger = document.getElementById(`mt-${S.ui.menu}`);
  if (!trigger) return;
  const r = trigger.getBoundingClientRect();
  const width = pop.offsetWidth;
  const left = Math.max(8, Math.min(r.right - width, window.innerWidth - width - 8));
  pop.style.top = `${r.bottom + window.scrollY + 4}px`;
  pop.style.left = `${left + window.scrollX}px`;
}

function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  const s = params.get('s');
  S.s = SCREENS.some((x) => x.id === s) ? s : 'att';
  const screen = SCREENS.find((x) => x.id === S.s);
  const v = params.get('v');
  S.v = screen.vs.some(([key]) => key === v) ? v : screen.vs[0][0];
  S.theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  S.bar = params.get('bar') !== '0';
  S.ui = startUi(S.s, S.v);
}
function writeHash(patch) {
  const next = { s: S.s, v: S.v, theme: S.theme, bar: S.bar ? null : '0', ...patch };
  const params = new URLSearchParams();
  params.set('s', next.s);
  params.set('v', next.v);
  if (next.theme === 'dark') params.set('theme', 'dark');
  if (next.bar === '0') params.set('bar', '0');
  location.hash = params.toString();
}
let toastTimer = null;
function toast(title, body, tone = 'success') {
  S.ui.toast = { title, body, tone };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.ui.toast = null; render(); }, 6000);
}
const set = (patch) => { Object.assign(S.ui, patch); render(); };

const ACTIONS = {
  go: (el) => writeHash({ s: el.dataset.s, v: el.dataset.v || SCREENS.find((x) => x.id === el.dataset.s).vs[0][0] }),
  theme: (el) => writeHash({ theme: el.dataset.themeTo }),
  filter: (el) => set({ filter: el.dataset.filter, menu: null }),
  menu: (el) => set({ menu: S.ui.menu === el.dataset.id ? null : el.dataset.id }),
  close: () => set({ dialog: null }),
  noop: () => set({ menu: null }),
  toastclose: () => set({ toast: null }),
  remind: (el) => { toast('Reminder sent', `Sent to ${P[el.dataset.who].name}.`); set({ menu: null }); },
  remindall: () => { toast('Reminder sent', 'Sent to Priya Sharma.'); render(); },
  remindone: (el) => { const m = MISSING.find((x) => x.id === el.dataset.id); toast('Reminder sent', `Sent to ${P[m.p].name}.`); render(); },
  bulkremind: () => { toast('Reminded 2 people', 'Karan Mehta was reminded at 10:05. You can remind again at 10:35.', 'plain'); render(); },
  leavemark: (el) => set({ menu: null, dialog: el.dataset.who ? { type: 'leave', mode: 'row', who: el.dataset.who, part: 'full', pay: 'paid' } : { type: 'leave', mode: 'mark', part: 'second_half', pay: 'paid' } }),
  leaveedit: () => set({ menu: null, dialog: { type: 'leave', mode: 'edit', part: 'full', pay: 'unpaid' } }),
  leavedelete: () => set({ menu: null, dialog: { type: 'leavedelete' } }),
  leavesave: () => { toast('Leave saved', S.ui.dialog.mode === 'range' ? 'Priya Sharma, Thu, 5 – Mon, 9 Nov' : 'Karan Mehta, Fri, 20 Nov'); set({ dialog: null }); },
  leavedeleted: () => { toast('Leave deleted', 'Meera Nair, Thu, 19 – Fri, 20 Nov'); set({ dialog: null }); },
  seg: (el) => { const d = { ...S.ui.dialog }; d[el.dataset.group] = el.dataset.val; set({ dialog: d }); },
  holidayadd: () => set({ menu: null, dialog: { type: 'holidayadd' } }),
  holidaydelete: () => set({ menu: null, dialog: { type: 'holidaydelete' } }),
  holidaysave: () => { toast('Holiday added', 'Office closed for repairs, Fri, 13 Nov'); set({ dialog: null }); },
  holidaydeleted: () => { toast('Holiday deleted'); set({ dialog: null }); },
  breaks: (el) => set({ menu: null, dialog: { type: 'breaks', who: el.dataset.who } }),
  brkform: (el) => set({ dialog: { ...S.ui.dialog, form: { id: Number(el.dataset.id), kind: el.dataset.kind } } }),
  brkcancel: () => { const id = S.ui.dialog.form && S.ui.dialog.form.id; set({ dialog: { ...S.ui.dialog, form: null } }); const b = document.getElementById(`bf-${id}`); if (b) b.focus(); },
  brksave: () => { toast('Break changed'); set({ dialog: { ...S.ui.dialog, form: null } }); const t = document.getElementById('dlg-title'); if (t) t.focus(); },
  brkdelete: () => { toast('Break deleted'); set({ dialog: { ...S.ui.dialog, form: null } }); const t = document.getElementById('dlg-title'); if (t) t.focus(); },
  rowaction: () => set({ menu: null }),
  rowfix: (el) => set({ menu: null, dialog: { type: 'rowfix', id: el.dataset.id || 'k18' } }),
  fixsave: (el) => { const m = MISSING.find((x) => x.id === el.dataset.id); toast('Check-out saved', `${P[m.p].name}, ${m.day}`); set({ dialog: null }); },
  bulkclear: () => set({ sel: [] }),
  bulkfix: () => {
    const missingTime = S.ui.sel.filter((id) => !(S.ui.vals[id] ?? MISSING.find((m) => m.id === id).val));
    if (missingTime.length) {
      const errs = {}; missingTime.forEach((id) => { errs[id] = 'Add a time.'; });
      set({ errs }); const first = document.getElementById(`out-${missingTime[0]}`); if (first) first.focus();
      return;
    }
    set({ dialog: { type: 'missingfix' } });
  },
  bulkdone: () => { toast('Fixed 3 check-outs'); set({ dialog: null, removedGone: S.ui.removedGone.concat(S.ui.sel), sel: [] }); },
  popupopen: () => set({ dialog: { type: 'popup', row: 0, time: null, one: todayCfg().help.missing === 'one' } }),
  popupsave: () => {
    const d = S.ui.dialog;
    const rows = popupRows(d);
    const row = rows[d.row];
    const value = d.time ?? row.val;
    const over = row.limit === null || (value && value > row.limit);
    if (over) toast('Sent to HR', `HR will check your check-out for ${row.day}.`);
    else toast('Check-out saved', `${row.day}, ${formatClock(value)}.`);
    if (d.row < rows.length - 1) set({ dialog: { ...d, row: d.row + 1, time: null, status: `Saved. Next: ${rows[d.row + 1].day}.` } });
    else set({ dialog: null });
  },
  putback: () => { toast('Time put back', '45 min went back on your acme-app timer.'); set({ removedGone: ['put'] }); },
  awaykeep: () => { toast('Kept as work'); set({ dialog: null }); },
  awayremove: () => { toast('Counted as a break', '32 min came off your acme-app timer.'); set({ dialog: null }); },
  awayleft: () => { toast('Checked out at 6:42 PM', 'Your acme-app timer stopped then too.'); set({ dialog: null }); },
};

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-act]');
  if (el && ['sel', 'selall', 'outval', 'popuptime'].includes(el.dataset.act)) return;
  if (!el) {
    if (S.ui.menu && !event.target.closest('.menu-pop')) set({ menu: null });
    if (event.target.closest('a[href="#"]')) event.preventDefault();
    return;
  }
  event.preventDefault();
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener('change', (event) => {
  const el = event.target;
  if (el.dataset.act === 'sel') {
    const sel = el.checked ? S.ui.sel.concat(el.dataset.id) : S.ui.sel.filter((id) => id !== el.dataset.id);
    set({ sel });
  }
  if (el.dataset.act === 'selall') {
    const ids = MISSING.filter((m) => !m.own && !m.pending && !S.ui.removedGone.includes(m.id)).map((m) => m.id);
    set({ sel: el.checked ? ids : [] });
  }
});
document.addEventListener('input', (event) => {
  const el = event.target;
  if (el.dataset.act === 'outval') { S.ui.vals[el.dataset.id] = el.value; if (S.ui.errs[el.dataset.id]) { delete S.ui.errs[el.dataset.id]; render(); } }
  if (el.dataset.act === 'popuptime') set({ dialog: { ...S.ui.dialog, time: el.value } });
});
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  if (S.ui.menu) { const id = S.ui.menu; set({ menu: null }); const t = document.getElementById(`mt-${id}`); if (t) t.focus(); return; }
  if (S.ui.dialog) set({ dialog: null });
});
window.addEventListener('hashchange', () => { readHash(); render(); });
window.addEventListener('resize', placeMenu);
readHash();
render();
</script>
