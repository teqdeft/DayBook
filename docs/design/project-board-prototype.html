<!doctype html>
<html lang="en" data-role="pm" data-width="desktop" data-screen="pm-project">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook: Project board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --font-heading: 'Schibsted Grotesk';
  --font-body: 'Figtree';
  --font-heading-stack: var(--font-heading), 'Schibsted Grotesk', system-ui, sans-serif;
  --font-body-stack: var(--font-body), 'Figtree', system-ui, sans-serif;
  --paper: #f5f6fa; --surface: #ffffff; --surface-muted: #f8f9fc; --track: #eef0f6; --line: #e6e8f0; --line-strong: #dcdfea; --line-dashed: #c5c8d4;
  --ink: #1b1e33; --ink-2: #3e4460; --muted: #5b6178; --placeholder: #757575;
  --navy: #151833; --navy-raised: #20244a; --navy-active: #2d3272; --navy-text: #c9cce0; --navy-muted: #9ea2c4; --navy-line: #262a52;
  --primary: #3848d6; --primary-hover: #2733a8; --primary-soft: #e7e9fb; --primary-text: #26329a; --on-primary: #ffffff; --on-fill: #ffffff;
  --marigold: #ffb020; --marigold-ink: #3b2600; --marigold-soft: #fff1d6; --marigold-text: #6b4500;
  --green: #0c8a5b; --green-soft: #e1f3eb; --green-text: #09633f;
  --red: #d12f3a; --red-soft: #fbe3e4; --red-text: #9a1f28;
  --violet: #7b45d6; --violet-soft: #eee7fa; --violet-text: #55289f;
  --red-on-surface: #d12f3a; --violet-on-surface: #7b45d6; --switch-off: #c9ccdb;
  --label-blue-bg: #e7e9fb;   --label-blue-text: #26329a;   --label-blue: #3848d6;
  --label-green-bg: #e1f3eb;  --label-green-text: #09633f;  --label-green: #0c8a5b;
  --label-violet-bg: #eee7fa; --label-violet-text: #55289f; --label-violet: #7b45d6;
  --label-orange-bg: #fdebdd; --label-orange-text: #8a3f05; --label-orange: #f07a1a;
  --label-teal-bg: #ddf1f5;   --label-teal-text: #0d5f72;   --label-teal: #1a9bb8;
  --label-pink-bg: #fbe5ee;   --label-pink-text: #8e2350;   --label-pink: #d6457a;
  --label-yellow-bg: #f6f2c0; --label-yellow-text: #565000; --label-yellow: #d4b300;
  --urgent-bg: #fff7e4; --urgent-line: #f8e2b0;
  --overlay: rgba(21, 24, 51, 0.36);
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary);
  --shadow-dialog: 0 24px 64px color-mix(in srgb, var(--navy) 18%, transparent);
  --shadow-popover: 0 16px 40px color-mix(in srgb, var(--navy) 14%, transparent);
  --shadow-menu: 0 12px 32px color-mix(in srgb, var(--navy) 14%, transparent);
  /* new in 1.12: the picture viewer's veil, the same dark in both themes */
  --photo-veil: rgba(5, 6, 16, 0.86);
  --text-page-title: 30px; --text-card-title: 18px; --text-big-number: 34px; --text-body: 15px; --text-small: 13px; --text-tag: 12px;
  --radius-card: 16px; --radius-tile: 12px; --radius-control: 10px; --radius-cell: 8px; --radius-label: 6px; --radius-pill: 999px;
  --sidebar-width: 240px; --main-padding-y: 28px; --main-padding-x: 32px; --block-gap: 22px;
  --control-height: 44px; --control-height-compact: 40px; --status-cell-height: 34px; --pill-height: 36px; --label-height: 26px;
  --table-head-height: 40px; --table-row-height: 54px; --drawer-width: 460px;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --paper: #0f1226; --surface: #1a1e3a; --surface-muted: #151935; --track: #252a4d; --line: #2c3156; --line-strong: #363c66; --line-dashed: #454b7a;
  --ink: #eceef7; --ink-2: #cdd1e6; --muted: #a0a5c3; --placeholder: #7d82a3;
  --navy: #0b0d1f; --navy-raised: #171a38; --navy-active: #262b66; --navy-line: #1d2146;
  --primary: #8c97ff; --primary-hover: #a6aeff; --primary-soft: #262b5c; --primary-text: #c3c9ff; --on-primary: #0f1226;
  --marigold-soft: #3a2c10; --marigold-text: #ffd48a; --green-soft: #12352a; --green-text: #7fd8b3; --red-soft: #3d1a22; --red-text: #ff9aa3;
  --violet-soft: #2c2350; --violet-text: #cdb5ff; --red-on-surface: #ff6b76; --violet-on-surface: #a985ff; --switch-off: #3d4370;
  --label-blue-bg: #262b5c;   --label-blue-text: #c3c9ff;
  --label-green-bg: #12352a;  --label-green-text: #7fd8b3;
  --label-violet-bg: #2c2350; --label-violet-text: #cdb5ff;
  --label-orange-bg: #3d2614; --label-orange-text: #ffbd85;
  --label-teal-bg: #0f3440;   --label-teal-text: #8adcee;
  --label-pink-bg: #3d1a2b;   --label-pink-text: #ffa3c4;
  --label-yellow-bg: #32310f; --label-yellow-text: #e5da69;
  --urgent-bg: #2e2412; --urgent-line: #4d3a17; --overlay: rgba(5, 6, 16, 0.6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;
    --paper: #0f1226; --surface: #1a1e3a; --surface-muted: #151935; --track: #252a4d; --line: #2c3156; --line-strong: #363c66; --line-dashed: #454b7a;
    --ink: #eceef7; --ink-2: #cdd1e6; --muted: #a0a5c3; --placeholder: #7d82a3;
    --navy: #0b0d1f; --navy-raised: #171a38; --navy-active: #262b66; --navy-line: #1d2146;
    --primary: #8c97ff; --primary-hover: #a6aeff; --primary-soft: #262b5c; --primary-text: #c3c9ff; --on-primary: #0f1226;
    --marigold-soft: #3a2c10; --marigold-text: #ffd48a; --green-soft: #12352a; --green-text: #7fd8b3; --red-soft: #3d1a22; --red-text: #ff9aa3;
    --violet-soft: #2c2350; --violet-text: #cdb5ff; --red-on-surface: #ff6b76; --violet-on-surface: #a985ff; --switch-off: #3d4370;
    --label-blue-bg: #262b5c;   --label-blue-text: #c3c9ff;
    --label-green-bg: #12352a;  --label-green-text: #7fd8b3;
    --label-violet-bg: #2c2350; --label-violet-text: #cdb5ff;
    --label-orange-bg: #3d2614; --label-orange-text: #ffbd85;
    --label-teal-bg: #0f3440;   --label-teal-text: #8adcee;
    --label-pink-bg: #3d1a2b;   --label-pink-text: #ffa3c4;
    --label-yellow-bg: #32310f; --label-yellow-text: #e5da69;
    --urgent-bg: #2e2412; --urgent-line: #4d3a17; --overlay: rgba(5, 6, 16, 0.6);
  }
}
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body-stack); font-size: var(--text-body); line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-heading-stack); color: var(--ink); }
.num { font-family: var(--font-heading-stack); font-variant-numeric: tabular-nums; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
ul, ol { margin: 0; padding: 0; list-style: none; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
table { border-collapse: collapse; width: 100%; }
:focus { outline: none; }
[hidden] { display: none !important; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

/* ---------- prototype control bar (not Daybook) ---------- */
.pc { position: relative; z-index: 300; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 7px 8px; padding: 9px clamp(12px, 2vw, 24px); background: var(--track); border-bottom: 2px dashed var(--line-dashed); font-size: 13px; line-height: 18px; color: var(--ink-2); }
.pc-title { font-family: var(--font-heading-stack); font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.pc-sub { flex: 1 1 380px; min-width: 0; color: var(--muted); }
.pc-group { display: inline-flex; align-items: center; gap: 6px; }
.pc-label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.pc-seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pc-seg button { height: 26px; padding: 1px 10px 0; border-radius: 8px; color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.pc-seg button:hover { color: var(--ink); }
.pc-seg button[aria-pressed='true'] { background: var(--ink); color: var(--surface); font-weight: 600; }
.pc-btn { display: inline-flex; align-items: center; height: 30px; padding: 1px 11px 0; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pc-btn:hover { background: var(--surface-muted); }
.pc-sel { height: 30px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; }
.show-controls { position: fixed; left: 8px; bottom: 8px; z-index: 300; height: 26px; padding: 0 10px; border: 1px dashed var(--line-dashed); border-radius: 999px; background: var(--track); color: var(--muted); font-size: 12px; font-weight: 600; }

/* ---------- stage and device (the app is a container) ---------- */
.stage { position: relative; display: flex; flex: 1 1 auto; min-height: 0; }
.device { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; overflow: hidden; background: var(--paper); container: app / inline-size; }
body.is-phone .stage { flex-direction: column; align-items: center; overflow: auto; padding: 24px 16px 20px; background: color-mix(in srgb, var(--track) 70%, var(--paper)); }
body.is-phone .device { flex: none; width: 390px; height: 844px; border-radius: 30px; box-shadow: 0 0 0 1px var(--line-strong), 0 0 0 9px var(--navy), 0 24px 64px color-mix(in srgb, var(--navy) 25%, transparent); }
.frame-note { display: none; }
body.is-phone .frame-note { display: block; flex: none; margin-top: 18px; font-size: 12px; color: var(--muted); }
@media (max-width: 440px) {
  body.is-phone .stage { padding: 0; background: var(--paper); }
  body.is-phone .device { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  body.is-phone .frame-note { display: none; }
}

/* ---------- shell and sidebar ---------- */
.shell { display: flex; height: 100%; }
.side { flex: none; display: flex; flex-direction: column; width: var(--sidebar-width); height: 100%; padding: 22px 14px; overflow-y: auto; background: var(--navy); color: var(--navy-text); }
.brand { display: flex; flex: none; align-items: center; gap: 10px; height: 32px; margin-left: 8px; }
.brand-word { font-family: var(--font-heading-stack); font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: var(--on-fill); }
.workspace { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 54px; margin-top: 22px; padding: 0 12px; border-radius: 12px; background: var(--navy-raised); color: var(--on-fill); }
.ws-text { display: flex; flex-direction: column; min-width: 0; text-align: left; }
.ws-label { font-size: 12px; line-height: 16px; color: var(--navy-muted); }
.ws-name { font-size: 14px; font-weight: 600; line-height: 18px; }
.nav { margin-top: 22px; }
.nav-list { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 12px; border-radius: 10px; color: var(--navy-text); line-height: 20px; }
.nav-item:hover { background: color-mix(in srgb, var(--navy-active) 45%, transparent); }
.nav-item:focus-visible { box-shadow: 0 0 0 2px var(--navy), 0 0 0 4px var(--primary); }
.nav-item.active { background: var(--navy-active); color: var(--on-fill); font-weight: 600; }
.nav-item svg { flex: none; }
.nav-label { flex: 1; min-width: 0; }
.nav-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--marigold); color: var(--marigold-ink); font-family: var(--font-heading-stack); font-size: 12px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.side-bottom { margin-top: auto; padding-top: 16px; }
.person { padding-top: 13px; border-top: 1px solid var(--navy-line); }
.person-row { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.person-av { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: var(--navy-active); color: var(--on-fill); font-size: 13px; font-weight: 600; line-height: 1; }
.person-name { display: block; font-size: 14px; font-weight: 600; line-height: 18px; color: var(--on-fill); }
.person-role { display: block; font-size: 13px; line-height: 18px; color: var(--navy-muted); }
.version { margin-top: 10px; padding: 0 8px; font-size: 12px; line-height: 16px; color: var(--navy-muted); }
.side-veil { position: absolute; inset: 0; z-index: 55; background: var(--overlay); animation: fade .15s ease; }
.scroller { flex: 1 1 auto; min-width: 0; height: 100%; overflow-x: hidden; overflow-y: auto; }
.main { display: flex; flex-direction: column; gap: var(--block-gap); min-width: 0; padding: var(--main-padding-y) var(--main-padding-x); }
.ib.menu-btn { display: none; }
@container app (max-width: 1023px) {
  .ib.menu-btn { display: inline-flex; }
  .side { position: absolute; z-index: 60; top: 0; bottom: 0; left: 0; height: auto; transform: translateX(-100%); visibility: hidden; transition: transform .2s ease, visibility 0s linear .2s; }
  .side.open { transform: none; visibility: visible; box-shadow: var(--shadow-dialog); transition: transform .2s ease; }
  .main { gap: 18px; padding: 20px 24px 32px; }
}
@container app (max-width: 640px) { .main { padding: 16px 16px 28px; } }

/* ---------- top bar, header, tabs ---------- */
/* TopBar, Breadcrumb and ProjectTabs as in the app */
.tb { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; min-width: 0; }
.tb-lead { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb-title, .ph-h1 { position: relative; top: 2px; font-size: var(--text-page-title); font-weight: 700; line-height: 36px; letter-spacing: -0.02em; }
.tb-sub, .ph-sub { position: relative; top: 2px; margin-top: 1px; line-height: 22px; color: var(--muted); }
.tb-act { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 1px; font-size: 14px; font-weight: 500; line-height: 20px; color: var(--muted); }
.crumb a { color: var(--muted); border-radius: 4px; }
.crumb a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.crumb span:last-child { color: var(--ink); }
/* the title is an inline-flex span inside the h1, as ProjectView draws it (the tags take the h1's letter spacing) */
.ph-title { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; max-width: 100%; }
.ph-title .sq { position: relative; top: -1px; }
.ph-name { min-width: 0; overflow-wrap: anywhere; }
.ph-sub .urg { color: var(--marigold-text); }
/* the project page: header, tabs and the tab 14 px apart (ProjectView's page) */
.ppage { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tabs { display: flex; flex: none; gap: 4px; box-shadow: inset 0 -1px 0 var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; flex: none; align-items: center; height: 44px; padding: 2px 14px 0; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; line-height: 1; }
.tab:hover { color: var(--ink); }
.tab:focus-visible { box-shadow: inset 0 0 0 2px var(--primary); }
.tab[aria-current='page'] { border-color: var(--primary); color: var(--ink); font-weight: 600; }
@container app (max-width: 1023px) {
  .tb { align-items: flex-start; }
  .tb-lead { flex: 1 1 100%; align-items: flex-start; }
  .tb-title, .ph-h1 { font-size: 24px; line-height: 30px; }
  .tb-sub, .ph-sub { font-size: 14px; line-height: 20px; }
  .tb-act { flex: 1 1 100%; gap: 10px; }
}
@container app (max-width: 640px) {
  .tb-act { width: 100%; }
  .tb-act .search { flex: 1 1 100%; width: auto; }
  .tb-act .btn { flex: 1 1 auto; }
}

/* ---------- buttons, tags, avatars, labels ---------- */
.btn { display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 8px; height: var(--control-height); padding: 2px 17px 0; border: 1px solid transparent; border-radius: var(--radius-control); font-size: 15px; font-weight: 600; line-height: 1; white-space: nowrap; transition: background-color .12s ease, border-color .12s ease; }
.btn > svg { flex: none; margin-top: -2px; }
.btn-p { background: var(--primary); color: var(--on-primary); }
.btn-p:hover { background: var(--primary-hover); }
.btn-s { padding-inline: 18px; background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn-s:hover { background: var(--surface-muted); }
.btn-d { padding-inline: 17.5px; background: var(--surface); border-color: color-mix(in srgb, var(--red) 28%, var(--surface)); color: var(--red-text); }
.btn-d:hover { background: var(--red-soft); }
.btn-m { background: var(--marigold); color: var(--marigold-ink); }
.btn-c { height: var(--control-height-compact); padding-top: 0; }
/* Button size="small": 37 px, the same text and sides as the default */
.btn-sm { height: 37px; }
.btn[aria-disabled='true'], .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-t { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; color: var(--primary); font-weight: 600; line-height: 1.45; }
.btn-t:hover { text-decoration: underline; text-underline-offset: 3px; }
.ib { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: var(--radius-cell); color: var(--muted); }
.ib:hover { background: var(--track); color: var(--ink); }
.ib:disabled { opacity: .4; cursor: default; background: none; }
.ib-44 { width: 44px; height: 44px; border-radius: var(--radius-control); }
.ib-s { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.ib-s:hover { background: var(--surface-muted); }
@container app (max-width: 640px) { .ib { width: 44px; height: 44px; } }
.tag { display: inline-flex; flex: none; align-items: center; gap: 6px; font-family: var(--font-body-stack); vertical-align: middle; height: 22px; padding: 0 10px; border-radius: var(--radius-pill); background: var(--tb); color: var(--tt); font-size: var(--text-tag); font-weight: 600; line-height: 1; white-space: nowrap; }
.tag-md { height: 26px; }
.tag-xl { height: 32px; padding: 0 12px; font-size: 13px; }
.tag-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.t-pri { --tb: var(--primary-soft); --tt: var(--primary-text); }
.t-red { --tb: var(--red-soft); --tt: var(--red-text); }
.t-mar { --tb: var(--marigold-soft); --tt: var(--marigold-text); }
.t-grn { --tb: var(--green-soft); --tt: var(--green-text); }
.t-vio { --tb: var(--violet-soft); --tt: var(--violet-text); }
.t-neu { --tb: var(--line); --tt: var(--ink-2); }
/* PriorityTag size sm (its default) */
.pt { display: inline-flex; flex: none; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 7px; border-radius: var(--radius-label); font-family: var(--font-heading-stack); font-size: 12px; font-weight: 700; line-height: 1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.p1 { background: var(--red-soft); color: var(--red-text); }
.p2 { background: var(--marigold-soft); color: var(--marigold-text); }
.p3 { background: var(--line); color: var(--ink-2); }
.av { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ab); color: var(--at); font-size: 10px; font-weight: 600; line-height: 1; }
.av-30 { width: 30px; height: 30px; font-size: 11px; }
.av-any { background: transparent; border: 1.5px dashed var(--line-dashed); color: var(--muted); }
.a-blue { --ab: var(--label-blue-bg); --at: var(--label-blue-text); }
.a-green { --ab: var(--label-green-bg); --at: var(--label-green-text); }
.a-violet { --ab: var(--label-violet-bg); --at: var(--label-violet-text); }
.a-orange { --ab: var(--label-orange-bg); --at: var(--label-orange-text); }
.a-teal { --ab: var(--label-teal-bg); --at: var(--label-teal-text); }

.avs { display: inline-flex; padding-left: 6px; }
.avs .av { margin-left: -4px; box-shadow: 0 0 0 2px var(--surface); }
.sz { font-family: var(--font-heading-stack); }
.win-title[tabindex='-1']:focus-visible { box-shadow: none; }
.c-green { --lb: var(--label-green-bg); --lt: var(--label-green-text); --lc: var(--label-green); }
.c-blue { --lb: var(--label-blue-bg); --lt: var(--label-blue-text); --lc: var(--label-blue); }
.c-orange { --lb: var(--label-orange-bg); --lt: var(--label-orange-text); --lc: var(--label-orange); }
.c-pink { --lb: var(--label-pink-bg); --lt: var(--label-pink-text); --lc: var(--label-pink); }
.c-violet { --lb: var(--label-violet-bg); --lt: var(--label-violet-text); --lc: var(--label-violet); }
.c-teal { --lb: var(--label-teal-bg); --lt: var(--label-teal-text); --lc: var(--label-teal); }
.c-yellow { --lb: var(--label-yellow-bg); --lt: var(--label-yellow-text); --lc: var(--label-yellow); }
/* ProjectSquare: font 0.43 and radius 0.25 of the size, rounded */
.sq { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; background: var(--lb); color: var(--lt); font-family: var(--font-heading-stack); font-size: 15px; font-weight: 700; line-height: 1; }
.sq-28 { width: 28px; height: 28px; border-radius: 7px; font-size: 12px; }
.sq-36 { width: 36px; height: 36px; border-radius: 9px; font-size: 15px; }
.sq-42 { width: 42px; height: 42px; border-radius: 11px; font-size: 18px; }
.plabel { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 26px; line-height: 1; padding: 0 10px; border-radius: var(--radius-label); background: var(--lb); color: var(--lt); font-size: 13px; font-weight: 600; white-space: nowrap; }
.muted { color: var(--muted); }
.tx-red { color: var(--red-text); } .tx-mar { color: var(--marigold-text); } .tx-grn { color: var(--green-text); } .tx-pri { color: var(--primary-text); }
.small { font-size: 13px; line-height: 18px; }

/* ---------- cards, pills, segmented, inputs ---------- */
.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
.pad { padding: 20px 24px; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.card-title { font-size: var(--text-card-title); font-weight: 600; line-height: 22px; }
.card-sub { font-size: 13px; color: var(--muted); }
@container app (max-width: 640px) { .pad { padding: 16px; } }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; justify-content: center; height: var(--pill-height); padding: 0 13.5px; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; line-height: 1; white-space: nowrap; }
.pill:hover { background: var(--surface-muted); }
.pill[aria-pressed='true'] { border-color: var(--ink); background: var(--ink); color: var(--surface); font-weight: 600; }
.seg { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 3px; border-radius: var(--radius-control); background: var(--track); }
.seg button { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: var(--radius-cell); color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed='true'] { background: var(--surface); color: var(--ink); font-weight: 600; }
/* Input, Select, Textarea, SearchBox, Field and EmptyState as in the app */
.inp { display: block; width: 100%; min-width: 0; height: var(--control-height); padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--surface); font-size: 15px; line-height: 20px; transition: border-color .12s ease; }
input.inp { padding-top: 1px; }
.inp::placeholder { color: var(--placeholder); opacity: 1; }
.inp:hover { border-color: var(--muted); }
.inp:focus-visible, .inp:focus { border-color: var(--primary); box-shadow: var(--focus-ring); }
textarea.inp { height: auto; min-height: 88px; padding: 11px 13px; line-height: 22px; resize: vertical; }
.inp.bad, .inp[aria-invalid='true'] { border-color: var(--red); }
.inp.bad:focus, .inp[aria-invalid='true']:focus { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--red); }
.sel-w { position: relative; }
.sel-w select { appearance: none; padding-right: 38px; cursor: pointer; text-overflow: ellipsis; }
.sel-w svg { position: absolute; top: 14px; right: 12px; pointer-events: none; color: var(--muted); }
.search { position: relative; width: 240px; }
.search > svg { position: absolute; top: 50%; left: 13px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .inp { padding: 0 13px 0 38px; }
.search .inp::-webkit-search-cancel-button { appearance: none; }
@container app (max-width: 640px) { .inp { font-size: 16px; } }
.lbl { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; line-height: 18px; color: var(--ink-2); }
.opt { font-weight: 400; color: var(--muted); }
.help { margin-top: 5px; font-size: 12px; line-height: 16px; color: var(--muted); }
.err { margin-top: 5px; font-size: 13px; font-weight: 500; line-height: 18px; color: var(--red-text); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
.empty-t { font-family: var(--font-heading-stack); font-size: 16px; font-weight: 600; line-height: 22px; color: var(--ink); }
.empty-b { max-width: 360px; margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--muted); }
.empty .btn { margin-top: 16px; }

/* ---------- projects lists ---------- */
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@container app (max-width: 1279px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container app (max-width: 640px) { .pgrid { grid-template-columns: minmax(0, 1fr); gap: 14px; } }
/* My projects card (ProjectCard): head, then the new mini band, the stats, the priority line, the foot */
.pcard { position: relative; display: flex; flex-direction: column; padding: 20px 22px 23px; transition: border-color .12s ease; }
.pcard:hover { border-color: var(--line-strong); }
.pcard-top { display: flex; align-items: flex-start; gap: 12px; min-width: 0; padding-bottom: 12px; }
.pcard-name { flex: 1 1 auto; min-width: 0; }
.pcard-name .nm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-family: var(--font-heading-stack); font-size: 17px; font-weight: 600; line-height: 22px; }
.pcard-name .small { margin-top: 1px; }
.pcard-band { display: flex; flex-direction: column; gap: 8px; padding-bottom: 15px; border-bottom: 1px solid var(--track); }
/* StatusCell size "pill" */
.stc { display: inline-flex; flex: none; align-items: center; justify-content: center; height: 29px; padding: 0 10px; border-radius: var(--radius-cell); font-size: 13px; font-weight: 600; line-height: 1; white-space: nowrap; }
.stc-green { background: var(--green); color: var(--on-fill); }
.stc-marigold { background: var(--marigold); color: var(--marigold-ink); }
.stc-neutral { background: var(--line); color: var(--ink-2); }
.plink { border-radius: 4px; }
.plink::after { content: ''; position: absolute; inset: 0; z-index: 0; border-radius: var(--radius-card); }
.plink:focus-visible { box-shadow: none; }
.plink:focus-visible::after { box-shadow: var(--focus-ring); }
.pcard .over { position: relative; z-index: 1; }
.pcard-facts { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.pcard-facts strong { color: var(--ink); font-weight: 600; }
.pcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 47px; margin-top: auto; padding-top: 17px; white-space: nowrap; font-size: 14px; line-height: 20px; color: var(--muted); }
.pcard-foot > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mband { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
.mband i { height: 6px; border-radius: 3px; background: var(--track); }
.mband i.d { background: var(--green); }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.sec-h h2 { font-size: 16px; font-weight: 600; }
.clist > li { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1.5fr) minmax(0, 1fr) 150px; align-items: center; gap: 4px 14px; min-height: 52px; padding: 8px 20px; border-top: 1px solid var(--track); }
.clist > li:first-child { border-top: 0; }
.clist .cn { display: flex; flex-direction: column; min-width: 0; line-height: 19px; }
.clist .cn a { align-self: flex-start; font-weight: 600; border-radius: 4px; }
.clist .cn a:hover { text-decoration: underline; text-underline-offset: 3px; }
.clist .cn a::after { content: ''; position: absolute; inset: 0; }
.clist .cm { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); min-width: 0; }
.clist .ch { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
.clist .ch b { font-family: var(--font-heading-stack); font-size: 15px; color: var(--ink); font-weight: 600; }
.clist-foot { padding: 12px 20px; border-top: 1px solid var(--track); font-size: 13px; color: var(--muted); }
@container app (max-width: 640px) {
  .clist > li { grid-template-columns: 28px minmax(0, 1fr) auto; padding: 10px 16px; }
  .clist .cm { grid-column: 2 / 4; grid-row: 2; }
}
.dashed { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; padding: 20px 22px; border: 1px dashed var(--line-dashed); border-radius: var(--radius-card); }
.dashed strong { display: block; font-weight: 600; }
.mycard-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 13px 0 12px; border-bottom: 1px solid var(--track); }
.mycard-facts span { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
.mycard-facts b { display: block; margin-top: 3px; font-family: var(--font-heading-stack); font-size: 22px; font-weight: 700; line-height: 28px; color: var(--ink); }
.mycard-facts b.sm { margin-top: 1px; font-size: 14px; font-weight: 600; line-height: 28px; }
.prio { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; padding: 11px 0 12px; border-bottom: 1px solid var(--track); font-size: 14px; font-weight: 500; line-height: 20px; color: var(--ink-2); }
.prio svg { color: var(--muted); }
.prio .p1t { color: var(--red-text); font-weight: 600; }
.prio .p1t + svg, .prio.has-p1 > svg:first-child { color: var(--red-on-surface); }

/* ---------- band (the six phase parts) ---------- */
.bandcard { padding: 22px 24px 20px; }
.bstats { display: flex; align-items: flex-end; gap: 16px 32px; margin-bottom: 20px; }
.bs { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bs-k { font-size: 13px; color: var(--muted); }
.bs-v { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; color: var(--muted); font-size: 14px; }
.big { font-family: var(--font-heading-stack); font-size: 28px; font-weight: 700; line-height: 32px; letter-spacing: -0.01em; color: var(--ink); font-variant-numeric: tabular-nums; }
.mid { font-family: var(--font-heading-stack); font-size: 20px; font-weight: 600; line-height: 32px; color: var(--ink); font-variant-numeric: tabular-nums; }
.bs-act { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.band { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.bp { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 2px 0 4px; border-radius: 8px; text-align: left; }
.bp-bar { position: relative; display: block; width: 100%; height: 10px; overflow: hidden; border-radius: 6px; background: var(--track); }
.bp-bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 6px 0 0 6px; background: var(--primary); }
.bp.done .bp-bar { background: var(--green); }
.bp.cur .bp-bar { box-shadow: 0 0 0 2px var(--primary); }
.bp-text { display: flex; flex-direction: column; padding-right: 6px; }
.bp-name { display: flex; align-items: flex-start; gap: 4px; font-size: 13px; line-height: 17px; color: var(--ink-2); }
.bp-name svg { flex: none; margin-top: 1px; color: var(--green); }
.bp.cur .bp-name { font-weight: 600; color: var(--ink); }
.bp-n { font-size: 13px; line-height: 18px; color: var(--muted); }
.bp:hover .bp-name { color: var(--ink); }
.fc { display: flex; align-items: flex-start; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; line-height: 20px; color: var(--ink-2); }
.fc svg { flex: none; margin-top: 1px; }
.fc-off svg { color: var(--red-on-surface); } .fc-off strong { color: var(--red-text); }
.switch { display: none; align-items: center; justify-content: space-between; gap: 8px; }
.switch-t { min-width: 0; text-align: center; font-size: 15px; }
.switch-t b { font-family: var(--font-heading-stack); font-weight: 600; }
@container app (max-width: 640px) {
  .bandcard { padding: 16px; }
  .bstats { flex-wrap: wrap; gap: 12px 24px; margin-bottom: 16px; }
  .bs-act { width: 100%; margin-left: 0; }
  .bs-act .btn { flex: 1 1 auto; }
  .bp-text { display: none; }
  .bp { justify-content: center; min-height: 44px; padding: 0; }
  .switch { display: flex; }
}

/* ---------- board ---------- */
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.frow .note { flex: 1 1 100%; order: 3; font-size: 13px; color: var(--muted); }
.frow .note:empty { display: none; }
.bnav { display: none; gap: 8px; margin-left: auto; }
.board { display: flex; align-items: flex-start; gap: 12px; min-width: 0; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin; }
.board > * { scroll-snap-align: start; }
.frow.scrolls .bnav { display: flex; }
.col, .dcol { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 12px; background: var(--surface-muted); border: 1px solid var(--line); border-radius: var(--radius-card); transition: border-color .12s ease, background-color .12s ease; }
/* 236 px: a card's avatar, due tag, P tag and paperclip still fit on one line */
.col { flex: 1 1 0; min-width: 236px; }
.col.cur { flex-grow: 1.25; min-width: 272px; }
.col.slim { flex: 0 0 140px; min-width: 0; }
.dcol { flex: 0 0 196px; }
.col.donep:not(.open) { display: none; }
.board.emp > .col { max-width: 480px; }
.col.drop-on { border-color: var(--primary); background: color-mix(in srgb, var(--primary-soft) 45%, var(--surface-muted)); }
.col-h { display: flex; flex-direction: column; gap: 2px; padding: 0 2px; }
.col-t { display: flex; align-items: center; gap: 6px; min-height: 32px; }
.col-t h3 { min-width: 0; overflow: hidden; font-size: 15px; font-weight: 600; line-height: 20px; white-space: nowrap; text-overflow: ellipsis; }
.slim .col-t h3 { white-space: normal; }
.col-tools { display: flex; flex: none; align-items: center; margin-left: auto; margin-right: -6px; }
.col-tools .ib { width: auto; min-width: 30px; height: 30px; gap: 3px; padding: 0 5px; font-size: 13px; }
.col-d { font-size: 13px; line-height: 18px; color: var(--muted); }
.slim .col-t { flex-wrap: wrap; }
.slim-empty { padding: 0 2px; font-size: 13px; line-height: 18px; color: var(--muted); }
.cards { display: flex; flex-direction: column; gap: 12px; }
.tc { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-tile); cursor: pointer; transition: opacity .15s ease, border-color .12s ease, box-shadow .12s ease, background-color 1.5s ease; }
.tc:hover { border-color: var(--line-strong); }
.tc.dim { opacity: .4; }
.tc.hl { background: var(--primary-soft); }
.tc.lift { box-shadow: var(--shadow-menu); opacity: .55; }
.tc-top { display: flex; align-items: flex-start; gap: 6px; }
.tc-title { flex: 1 1 auto; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; padding-top: 1px; border-radius: 4px; font-size: 15px; font-weight: 500; line-height: 20px; text-align: left; overflow-wrap: break-word; }
.tc-more { width: 28px; height: 28px; margin: -4px -6px -4px 0; opacity: 0; }
.tc:hover .tc-more, .tc:focus-within .tc-more, .tc-more[aria-expanded='true'] { opacity: 1; }
@media (hover: none) { .tc-more { opacity: 1; } }
.tc-rep { font-size: 13px; line-height: 18px; }
.tc-rep.r { color: var(--red-text); } .tc-rep.b { color: var(--primary-text); }
.tc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tc-meta .clip { margin-left: auto; }
.clip { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; color: var(--muted); font-family: var(--font-heading-stack); font-variant-numeric: tabular-nums; }
.own { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.tc.is-done .tc-title { color: var(--muted); }
.tc.is-done { background: var(--surface); }
/* DueTag on a done task: just the due date, no pill */
.due-done { display: inline-flex; align-items: center; height: 22px; font-size: 12px; font-weight: 600; line-height: 1; color: var(--muted); white-space: nowrap; }
.tc-drop { position: absolute; inset: -1px; z-index: 2; display: none; align-items: center; justify-content: center; gap: 6px; border: 2px dashed var(--primary); border-radius: var(--radius-tile); background: color-mix(in srgb, var(--primary-soft) 92%, transparent); color: var(--primary-text); font-size: 14px; font-weight: 600; pointer-events: none; }
.tc.file-over .tc-drop { display: flex; }
.tc-up { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
.gap { height: 64px; border: 2px dashed var(--line-dashed); border-radius: var(--radius-tile); }
.tick { position: relative; display: inline-flex; flex: none; align-items: center; justify-content: center; width: 36px; height: 36px; margin: -8px -4px -8px -8px; border-radius: 50%; cursor: pointer; }
.tick input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.tick-c { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 1.8px solid color-mix(in srgb, var(--muted) 55%, var(--line-strong)); border-radius: 50%; color: transparent; transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
.tick:hover .tick-c { border-color: var(--muted); color: var(--muted); }
.tick input:focus-visible + .tick-c { box-shadow: var(--focus-ring); color: var(--muted); }
.tick input:checked + .tick-c { border-color: var(--green); background: var(--green); color: var(--on-fill); }
/* the 10 px status dot for people who can't tick (a member, another PM) */
.sdot { flex: none; width: 10px; height: 10px; margin: 5px 4px 0 1px; border: 1.5px solid color-mix(in srgb, var(--muted) 55%, var(--line-strong)); border-radius: 50%; }
.sdot.d { border-color: var(--green); background: var(--green); }
.fold { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 6px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 500; }
.fold:hover { background: var(--track); color: var(--ink); }
.fold svg { transition: transform .15s ease; }
.fold[aria-expanded='true'] svg { transform: rotate(90deg); }
.addt { display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; padding: 0 8px; border-radius: var(--radius-control); color: var(--muted); font-size: 14px; font-weight: 500; }
.addt:hover { background: var(--track); color: var(--ink); }
.qa { display: flex; flex-direction: column; gap: 8px; }
.qa .inp { height: 40px; font-size: 14px; }
.qa-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.qa-row .ib { margin-left: auto; }
.dcol h3 { display: flex; align-items: center; min-height: 32px; padding: 0 2px; font-size: 15px; font-weight: 600; }
.dt { display: flex; flex-direction: column; gap: 2px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-tile); }
.dt-name { display: flex; gap: 6px; font-size: 14px; font-weight: 600; line-height: 19px; }
.dt-name svg { flex: none; margin-top: 2px; color: var(--green); }
.dt .small { padding-left: 22px; }
.dt .btn-t { align-self: flex-start; margin: 6px 0 0 22px; font-size: 13px; }
@container app (max-width: 1100px) {
  .board { overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; scrollbar-width: thin; }
  .col { flex: 0 0 272px; scroll-snap-align: start; }
  .col.cur { flex-basis: 296px; }
  .col.slim { flex-basis: 180px; }
  .dcol { flex: 0 0 196px; scroll-snap-align: start; }
  .bnav { display: flex; }
}
@container app (max-width: 640px) {
  .board { display: block; overflow: visible; padding: 0; }
  .board > .dcol, .board > .col { display: none; }
  .board > .col.sel { display: flex; }

@container app (max-width: 1023px) {
  /* DataTable's stacked card, as today: the P tag and title on top, then label and value rows */
  .ptab thead, .ptab colgroup { display: none; }
  .ptab, .ptab tbody, .ptab tr, .ptab td { display: block; width: 100%; }
  .ptab tbody tr { padding: 12px 16px; border-bottom: 1px solid var(--track); }
  .ptab tbody tr:last-child { border-bottom: 0; }
  .ptab td, .ptab td:first-child, .ptab td:last-child { display: grid; grid-template-columns: minmax(88px, 36%) minmax(0, 1fr); align-items: center; gap: 12px; height: auto; padding: 5px 0; border: 0; text-align: left; }
  .ptab td::before { content: attr(data-label); font-size: 13px; line-height: 18px; color: var(--muted); }
  .ptab td:first-child { grid-template-columns: minmax(0, 1fr); padding-bottom: 8px; }
  .ptab td:first-child::before { content: none; }
  .ptab td:nth-child(2), .ptab td:empty { display: none; }
  .ptab td > * { justify-self: start; }
  .ptab .ph-only { display: inline; }
}
.todo > li { display: flex; align-items: center; gap: 12px; min-height: 48px; border-top: 1px solid var(--track); }
.todo input { width: 18px; height: 18px; accent-color: var(--primary); }
.todo label { display: flex; flex: 1 1 auto; align-items: center; gap: 12px; min-width: 0; min-height: 44px; cursor: pointer; }
.todo .done-t { color: var(--muted); text-decoration: line-through; }
.report { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; padding: 22px 24px; border-radius: var(--radius-card); background: var(--navy); color: var(--on-fill); }
.report h2 { color: var(--on-fill); font-size: 20px; }
.report p { color: var(--navy-text); font-size: 14px; }
@container app (max-width: 640px) { .day b { font-size: 20px; } .day div { padding: 12px; } .report .btn { width: 100%; } }
/* ---------- 1.12: board extras, windows ---------- */
.bp.skip .bp-name { color: var(--muted); }
.av.away { opacity: .45; }
.away-t { font-size: 12px; color: var(--muted); }
.unchanged { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; border: 1px dashed var(--line-dashed); border-radius: var(--radius-tile); font-size: 14px; color: var(--ink-2); }
.unchanged svg { flex: none; margin-top: 2px; color: var(--muted); }
.proto-note { margin-top: 10px; padding: 8px 12px; border: 1px dashed var(--line-dashed); border-radius: 8px; background: var(--track); font-size: 13px; color: var(--ink-2); }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.win .unchanged { margin-bottom: 14px; }
.col.nophase { border-style: dashed; }
.dt-name .tag { margin-left: auto; }
.lnk { color: var(--primary); font-weight: 600; border-radius: 4px; text-align: left; }
.lnk:hover { text-decoration: underline; text-underline-offset: 3px; }
.win.w400 { max-width: 400px; }
.mvl { display: flex; flex-direction: column; gap: 6px; }
.mv-b { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius-control); }
.mv-b:hover { background: var(--surface-muted); }
.mv-b[aria-disabled='true'] { background: var(--surface-muted); color: var(--muted); cursor: default; }
.vis { display: flex; flex-direction: column; gap: 8px; min-width: 0; margin: 0; padding: 0; border: 0; }
.vis legend { padding: 0; }
.radio { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-control); cursor: pointer; }
.radio:has(input:checked) { border-color: var(--primary); }
.radio input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--primary); }
.radio b { display: block; font-weight: 600; }
.radio .help { margin-top: 2px; }
.namex { display: flex; align-items: center; gap: 8px; }
.namex .xt { flex: none; color: var(--muted); }
.chip.wide { grid-column: 1 / -1; height: auto; min-height: 52px; padding-top: 7px; padding-bottom: 7px; }
.chip.wide .ft-meta { white-space: normal; }
.chip.off .ft-name { color: var(--muted); text-decoration: line-through; }
.chip .rt { flex: none; padding: 0 6px; }
.fm-ask { flex: 1 1 auto; margin-right: auto; font-weight: 600; }
/* ---------- Files tab ---------- */
.files { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--block-gap); align-items: start; }
.places { padding: 8px; }
.places ul, .setnav ul { display: flex; flex-direction: column; gap: 2px; }
/* the side list looks like Settings' section list (SettingsNav) */
.pl { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 1px 12px 0; border-radius: var(--radius-control); color: var(--ink-2); font-size: 14px; line-height: 20px; }
.pl:hover { background: var(--surface-muted); color: var(--ink); }
.pl[aria-current='page'] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.pl-n { flex: 1 1 auto; min-width: 0; }
.pl .num { font-size: 13px; }
.pl.zero { color: var(--muted); }
.pl-h { padding: 12px 12px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.pl-sep { height: 1px; margin: 6px 8px; background: var(--line); }
.fmain { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fh { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; min-height: 44px; }
.fh-t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.fh-act { display: flex; flex-wrap: wrap; gap: 10px; }
.show { display: none; align-items: center; gap: 10px; }
.show .lbl { margin: 0; }
.show .sel-w { width: 260px; }
.ftools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.ftools .search { flex: 1 1 260px; width: auto; max-width: 420px; }
.sort { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.sort .sel-w { width: 180px; }
.flist { position: relative; min-height: 120px; padding: 0 20px; }
.fr { display: flex; align-items: flex-start; gap: 12px; min-height: 64px; padding: 12px 0; border-top: 1px solid var(--track); }
.frl > .fr:first-child { border-top: 0; }
.fthumb { flex: none; width: 44px; height: 44px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--track); }
.fthumb img { width: 100%; height: 100%; object-fit: cover; }
.fr > .ftile { margin: 4px 4px 0; }
.fr-t { flex: 1 1 auto; min-width: 0; }
.fr-n { display: flex; max-width: 100%; border-radius: 4px; font-weight: 600; line-height: 22px; text-align: left; }
.fr-n:hover { text-decoration: underline; text-underline-offset: 3px; }
.fr-m { font-size: 13px; line-height: 19px; color: var(--muted); }
.fr-x { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.fr-x span { display: inline-flex; align-items: center; gap: 5px; }
.fr-a { display: flex; flex: none; gap: 2px; }
.fsub { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 14px 0 2px; border-top: 1px solid var(--line); font-size: 15px; font-weight: 600; }
.flist > .fsub:first-child { border-top: 0; }
.flist > .empty { padding: 40px 0; }
.fl-drop { position: absolute; inset: -1px; z-index: 2; display: none; align-items: center; justify-content: center; gap: 8px; border: 2px dashed var(--primary); border-radius: var(--radius-card); background: color-mix(in srgb, var(--primary-soft) 94%, transparent); color: var(--primary-text); font-weight: 600; pointer-events: none; }
.flist.drag-in .fl-drop { display: flex; }
.upc { padding: 16px 20px; }
.upc-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 2px; }
.upc-h h3, .upc-f { font-size: 16px; font-weight: 600; }
.upc-f { margin-top: 16px; }
.upc-ask { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; font-weight: 600; }
/* ---------- Settings ---------- */
.setg { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.setnav { padding: 10px; }
.setcard { padding: 22px 24px 21.5px; }
.setcard .card-sub { position: relative; top: 1px; font-size: 14px; }
.space { display: flex; flex-direction: column; gap: 6px; padding-top: 16px; border-top: 1px solid var(--line); }
.pbar { position: relative; display: block; height: 8px; overflow: hidden; border-radius: 4px; background: var(--track); }
.pbar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; background: var(--primary); }
.pbar.m i { background: var(--marigold); }
.pbar.r i { background: var(--red); }
@container app (max-width: 1023px) {
  .files, .setg { grid-template-columns: minmax(0, 1fr); }
  .setg { gap: 16px; }
  .places { display: none; }
  /* Settings' section list turns into a row that scrolls sideways, as today */
  .setnav { padding: 6px; overflow-x: auto; }
  .setnav ul { flex-direction: row; gap: 4px; }
  .setnav .pl { min-height: 36px; white-space: nowrap; }
  .show { display: flex; }
  .fh-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
}
@container app (max-width: 640px) {
  .show, .fh-act, .fh-act .btn, .ftools .search, .sort { flex: 1 1 100%; max-width: none; }
  .show .sel-w, .sort .sel-w { flex: 1 1 auto; width: auto; }
  .fh-act .btn-p { order: -1; }
  .flist { padding: 0 16px; }
  .fl-drop { display: none !important; }
  .fr-a .ib { width: 44px; height: 44px; }
  .fr-n { padding: 11px 0; margin: -11px 0; }
  /* a two-line card: name and buttons on top, the meta line across the full width under them */
  .fr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
  .fr-t { display: contents; }
  .fr > .ftile, .fr > .fthumb { grid-column: 1; grid-row: 1 / span 2; align-self: start; }
  .fr-n { grid-column: 2; grid-row: 1; }
  .fr-a { grid-column: 3; grid-row: 1; margin: -11px -10px -11px 0; }
  .fr-m { grid-column: 2 / 4; grid-row: 2; }
  .fr-x { grid-column: 2 / 4; grid-row: 3; }
  .fr-m .lnk, .fsub .lnk { display: inline-block; padding: 13px 0; margin: -13px 0; }
  .sum .btn-t, .crit-t button { padding-block: 12px; margin-block: -12px; }
  .upc { padding: 14px 16px; }
  .chip .rt { min-height: 44px; }
  .upc-h .btn-t { padding: 12px 0; margin: -12px 0; }
  .radio { min-height: 44px; }
}

function phaseNote(i) {

  if (i < DB.cur) { const n = p.end ? diff(p.end, p.plan[1]) : 0; return n > 0 ? [`Ended ${plural(n, 'day')} late`, 'tx-red'] : null; }

  const list = $('#toasts'), li = document.createElement('li');

  li.innerHTML = `${ic(error ? 'alert' : 'ok', 18)}<div class="toast-t"><b>${esc(title)}</b>${body ? `<span>${esc(body)}</span>` : ''}</div>${undo ? '<button type="button" class="btn-t" data-t="undo">Undo</button>' : ''}<button type="button" class="ib" data-t="x" aria-label="Dismiss">${ic('x', 16)}</button>`;
  list.appendChild(li);
  while (list.children.length > 3) list.firstElementChild.remove();
  let left = undo ? 6000 : 4500, t0 = 0, timer = 0, paused = false;
  const close = () => { clearTimeout(timer); li.remove(); };
  const run = () => { t0 = Date.now(); timer = setTimeout(close, left); };
  const pause = () => { if (paused) return; paused = true; clearTimeout(timer); left -= Date.now() - t0; };
  const resume = () => { if (!paused || li.matches(':hover') || li.contains(document.activeElement)) return; paused = false; run(); };
  li.addEventListener('mouseenter', pause); li.addEventListener('mouseleave', resume);
  li.addEventListener('focusin', pause); li.addEventListener('focusout', () => setTimeout(resume));
  li.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; if (b.dataset.t === 'undo') undo(); close(); });
  run();
}

  syncAttrs(); await settle(); return state();
}
async function set(o = {}) {
  const { role, theme, width, controls } = o;
  if (role != null && !['pm', 'employee', 'admin'].includes(role)) throw new Error('role must be "pm", "employee" or "admin".');
  if (theme != null && !['light', 'dark', 'system'].includes(theme)) throw new Error('theme must be "light", "dark" or "system".');
  if (width != null && !['desktop', 'phone'].includes(width)) throw new Error('width must be "desktop" or "phone".');
  const h = document.documentElement;
  if (theme) { if (theme === 'system') delete h.dataset.theme; else h.dataset.theme = theme; }
  if (width) document.body.classList.toggle('is-phone', width === 'phone');
  if (controls != null) { $('#pc').hidden = !controls; $('#pc-show').hidden = !!controls; }
  if (role && role !== S.role) switchRole(role); else if (width) render(); else syncAttrs();
  await settle(); return state();
}
async function reset() {
  closeAll(); stopUploads();
  DB.urls.forEach(u => URL.revokeObjectURL(u));
  DB = initialData();
  Object.assign(S, { tab: 'board', filter: 'all', openDone: {}, fold: {}, phoneCol: 2, quick: null, quickText: '', hl: null, pmPill: 'active', pmSearch: '', empPill: 'active', empSearch: '', drag: null, place: 'all', fq: '', sf: null, setErr: {} });
  $('#toasts').innerHTML = '';
  render();
  await settle(); return state();
}
window.proto = { go, set, reset, state };

/* ================= start ================= */
render();
let wasPhone = isPhone();
new ResizeObserver(() => { const p = isPhone(); if (p !== wasPhone) { wasPhone = p; closeMenu(false); render(); } else syncBoardNav(); }).observe($('#device'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncAttrs);
</script>
